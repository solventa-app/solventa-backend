name: CI

# Corre solo lo que cambió: un cambio en services/risk no dispara el resto de servicios.
on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  TODOS: >-
    ["services/bff","services/auth","services/risk","services/rating","services/payments",
    "services/acl-worker","services/consolidador-fuentes","stubs/open-finance","stubs/open-data","stubs/pasarela"]

jobs:
  cambios:
    runs-on: ubuntu-latest
    outputs:
      servicios: ${{ steps.matriz.outputs.servicios }}
      contratos: ${{ steps.f.outputs.contratos }}
      infra: ${{ steps.f.outputs.infra }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: f
        with:
          filters: |
            comun:
              - 'requirements-dev.txt'
              - 'pyproject.toml'
              - '.github/workflows/ci.yml'
            contratos:
              - 'contracts/**'
              - 'scripts/validar_contratos.py'
              - 'requirements-dev.txt'
            infra:
              - 'infra/**'
            services/bff: ['services/bff/**']
            services/auth: ['services/auth/**']
            services/risk: ['services/risk/**']
            services/rating: ['services/rating/**']
            services/payments: ['services/payments/**']
            services/acl-worker: ['services/acl-worker/**']
            services/consolidador-fuentes: ['services/consolidador-fuentes/**']
            stubs/open-finance: ['stubs/open-finance/**']
            stubs/open-data: ['stubs/open-data/**']
            stubs/pasarela: ['stubs/pasarela/**']
      - name: Matriz de servicios afectados
        id: matriz
        run: |
          if [ "${{ steps.f.outputs.comun }}" = "true" ]; then
            echo "servicios=$(echo '${{ env.TODOS }}' | jq -c .)" >> "$GITHUB_OUTPUT"
          else
            echo "servicios=$(echo '${{ steps.f.outputs.changes }}' | jq -c '[.[] | select(startswith("services/") or startswith("stubs/"))]')" >> "$GITHUB_OUTPUT"
          fi

  servicio:
    needs: cambios
    if: needs.cambios.outputs.servicios != '[]'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        servicio: ${{ fromJSON(needs.cambios.outputs.servicios) }}
    defaults:
      run:
        working-directory: ${{ matrix.servicio }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            ${{ matrix.servicio }}/requirements.txt
            requirements-dev.txt
      - name: Instalar dependencias
        run: pip install -r requirements.txt -r ${{ github.workspace }}/requirements-dev.txt
      - name: Lint (ruff)
        run: ruff check .
      - name: Pruebas
        run: python -m pytest
      - name: Construir imagen
        run: docker build -t ${{ matrix.servicio }}:ci .

  contratos:
    needs: cambios
    if: needs.cambios.outputs.contratos == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements-dev.txt
      - run: python scripts/validar_contratos.py

  infra:
    needs: cambios
    if: needs.cambios.outputs.infra == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: infra
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
      - run: terraform fmt -check -recursive
      - run: terraform init -backend=false
      - run: terraform validate

  # Job "gate": el ruleset de `main` exige un status check llamado exactamente
  # "CI OK" (ver `gh api repos/.../rulesets/<id>`). Antes de este job no existía
  # ningún check con ese nombre, así que esa regla nunca se podía cumplir —
  # cualquier PR quedaba con "CI OK" en amarillo para siempre ("Waiting for
  # status to be reported"). `if: always()` es obligatorio: si este job
  # heredara una condición normal y no corriera, tampoco reportaría el check y
  # el problema persistiría igual.
  ci-ok:
    name: CI OK
    if: always()
    needs: [cambios, servicio, contratos, infra]
    runs-on: ubuntu-latest
    steps:
      - name: Verifica que ningún job requerido falló o se canceló
        run: |
          for r in "${{ needs.cambios.result }}" "${{ needs.servicio.result }}" \
                   "${{ needs.contratos.result }}" "${{ needs.infra.result }}"; do
            echo "resultado: $r"
            if [ "$r" = "failure" ] || [ "$r" = "cancelled" ]; then
              echo "::error::Un job requerido falló o se canceló ($r)."
              exit 1
            fi
          done
          echo "Todo en orden (success o skipped, ningún failure/cancelled)."

  sonar:
    # Se activa solo cuando el repo tiene los secretos SONAR_TOKEN y SONAR_HOST_URL.
    needs: [servicio]
    if: always() && github.event_name == 'push' && needs.servicio.result != 'failure'
    runs-on: ubuntu-latest
    env:
      SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
    steps:
      - uses: actions/checkout@v4
        if: env.SONAR_TOKEN != ''
      - uses: SonarSource/sonarqube-scan-action@v8
        if: env.SONAR_TOKEN != ''
        env:
          SONAR_HOST_URL: ${{ secrets.SONAR_HOST_URL }}
