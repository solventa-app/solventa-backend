name: Costos staging

# Apaga o enciende lo que cobra por hora en staging. Es un botón para el equipo, sin depender de nadie más:
#
#   Actions > Costos staging > Run workflow > elige la acción.
#
#   estado    solo informa qué está encendido y qué apagado (no cambia nada).
#   apagar    DETIENE Cloud SQL (conserva las bases, los usuarios y las migraciones; solo se paga el disco), BORRA
#             Redis y su conector VPC (es una caché: se recrea sola al encender) y devuelve los servicios con instancia
#             fija a mínimo 0 y CPU solo en las peticiones. Es lo que más ahorra: Redis y el conector cuestan ~USD 0,12/h
#             según infra/README.md, y las instancias fijas ~USD 4 al día (estimado).
#   encender  arranca Cloud SQL, vuelve a crear Redis y el conector (unos 10-15 minutos) y deja otra vez las
#             instancias fijas (mínimo 1).
#
# El estado queda guardado en gs://<proyecto>-tfstate/solventa-backend/costos/estado ("apagado" | "encendido") y el
# despliegue automático (deploy-staging.yml) lo respeta: un release no vuelve a encender lo que está apagado.
# Solo toca Cloud SQL, Redis, el conector VPC y el escalado de los servicios: si el plan destruyera otra cosa, el workflow falla sin aplicar nada.
#
# SE APAGA SOLO todos los días a las 2:00 a.m. hora de Colombia (por si se olvida apagarlo): es el bloque `schedule`,
# con tres reintentos más tarde por si GitHub retrasa o se salta la primera. Para quitarlo, borra ese bloque. GitHub puede demorar unos minutos en lanzar las ejecuciones programadas, y en un
# repositorio público las desactiva tras 60 días sin actividad. Si algo falla, infra/README.md explica cómo hacer lo
# mismo a mano desde Cloud Shell.
on:
  workflow_dispatch:
    inputs:
      accion:
        description: 'Qué hacer con lo que cobra por hora'
        type: choice
        options: [estado, apagar, encender]
        default: estado
  schedule:
    # 2:00 a.m. en Colombia (UTC-5, sin horario de verano) = 07:00 UTC. Siempre apaga.
    # Los cron de GitHub son de mejor esfuerzo: pueden llegar horas tarde o saltarse (el 18-oct llegó casi 5 h
    # tarde y el 19-oct no llegó). Por eso hay reintentos: apagar es idempotente (si ya está apagado, el plan no
    # tiene cambios y no se toca nada), así que las pasadas extra no cuestan nada cuando la primera funcionó.
    - cron: '0 7 * * *'
    - cron: '30 8 * * *'
    - cron: '0 10 * * *'
    - cron: '0 12 * * *'

permissions:
  contents: read

# Comparte el grupo con el despliegue: nunca dos `apply` a la vez sobre el mismo estado.
concurrency:
  group: deploy-staging
  cancel-in-progress: false

jobs:
  comprobar:
    # Como el resto del despliegue: no hace nada hasta que existan las variables y la protección de gasto.
    # El horario corre desde `develop` (rama por defecto) pero lo que se aplica es la infraestructura de `main`: hasta
    # que `main` traiga el apagado de costos, la ejecución programada se omite con un aviso en vez de fallar cada
    # noche; la manual sí falla con un error claro.
    if: >-
      vars.GCP_PROJECT_ID != '' && vars.GCP_PROTECCION_GASTO == 'activa' &&
      (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/develop')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      ok: ${{ steps.soporte.outputs.ok }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
      - name: ¿El Terraform de main ya sabe apagar y encender?
        id: soporte
        env:
          EVENTO: ${{ github.event_name }}
        run: |
          if grep -q 'cloud_sql_encendida' infra/variables.tf; then
            echo "ok=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "ok=false" >> "$GITHUB_OUTPUT"
          if [ "$EVENTO" = "schedule" ]; then
            echo "::notice title=Costos staging::main todavía no trae el apagado de costos; se omite el apagado programado."
          else
            echo "::error title=Costos staging::main todavía no trae el apagado de costos. Mezcla a main el release que incluye este workflow y vuelve a ejecutarlo."
            exit 1
          fi

  costos:
    needs: comprobar
    if: needs.comprobar.outputs.ok == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    environment: infra-staging
    permissions:
      contents: read
      id-token: write
    env:
      TF_INPUT: "0"
      TF_IN_AUTOMATION: "1"
      TF_VAR_project_id: ${{ vars.GCP_PROJECT_ID }}
      TF_VAR_billing_account_id: ${{ vars.GCP_BILLING_ACCOUNT_ID }}
      TF_VAR_mongodb_atlas_org_id: ${{ vars.MONGODB_ATLAS_ORG_ID }}
      PROYECTO: ${{ vars.GCP_PROJECT_ID }}
      # La ejecución programada (`schedule`) siempre apaga.
      ACCION: ${{ github.event_name == 'schedule' && 'apagar' || inputs.accion }}
    steps:
      # Las herramientas (la guardia de destrucciones) salen de la rama que se ejecuta; la infraestructura que se
      # aplica sale SIEMPRE de `main`, que es lo que está desplegado.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: herramientas
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          path: codigo
      - uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3
        with:
          workload_identity_provider: ${{ vars.GCP_WIF_PROVIDER }}
          service_account: ${{ vars.GCP_TERRAFORM_SA }}
      - uses: google-github-actions/setup-gcloud@aa5489c8933f4cc7a4f7d45035b3b1440c9c10db # v3
      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_wrapper: false
      - name: Terraform init
        working-directory: codigo/infra
        run: terraform init
      # Las claves de API de MongoDB Atlas viven SOLO en Secret Manager (el equipo las carga una vez; ver
      # infra/README.md, «MongoDB Atlas»). Se leen aquí, se enmascaran y se pasan a Terraform. Si todavía no
      # existen, no pasa nada mientras `crear_mongo_atlas` siga en `false`.
      - name: Credenciales de MongoDB Atlas (desde Secret Manager)
        run: |
          set -uo pipefail
          for par in MONGODB_ATLAS_PUBLIC_KEY:mongodb-atlas-public-key MONGODB_ATLAS_PRIVATE_KEY:mongodb-atlas-private-key; do
            variable=${par%%:*}
            secreto=${par#*:}
            if valor=$(gcloud secrets versions access latest --secret="$secreto" --project="$PROYECTO" 2>/dev/null); then
              echo "::add-mask::$valor"
              echo "$variable=$valor" >> "$GITHUB_ENV"
            else
              echo "No hay $secreto en Secret Manager (solo hace falta si crear_mongo_atlas = true)."
            fi
          done
      - name: Estado actual
        working-directory: codigo/infra
        run: |
          set -uo pipefail
          url="gs://${PROYECTO}-tfstate/solventa-backend/costos/estado"
          if salida=$(gcloud storage cat "$url" 2>&1); then
            marca=$(printf '%s' "$salida" | tr -d '[:space:]')
          elif printf '%s' "$salida" | grep -q -i -E 'matched no objects|not found|404'; then
            marca="encendido (aún no hay marca guardada)"
          else
            echo "::error title=Costos staging::No pude leer el estado guardado: $salida"
            exit 1
          fi
          existentes=$(terraform state list 2>/dev/null || true)
          sql="no existe"
          if printf '%s\n' "$existentes" | grep -q '^google_sql_database_instance\.principal'; then
            sql=$(terraform state show 'google_sql_database_instance.principal[0]' 2>/dev/null \
              | awk -F'"' '/activation_policy/ {print ($2=="NEVER") ? "detenida" : "en marcha"}' | head -1)
            sql=${sql:-"existe"}
          fi
          redis="no existe"
          if printf '%s\n' "$existentes" | grep -q '^google_redis_instance\.cache'; then redis="en marcha"; fi
          conector="no existe"
          if printf '%s\n' "$existentes" | grep -q '^google_vpc_access_connector\.conector'; then conector="en marcha"; fi
          fijas="no existe"
          if printf '%s\n' "$existentes" | grep -q '^google_cloud_run_v2_service\.servicio\["bff"\]'; then
            fijas=$(terraform state show 'google_cloud_run_v2_service.servicio["bff"]' 2>/dev/null \
              | awk '/min_instance_count/ {print ($3 > 0) ? "encendidas (mínimo 1)" : "apagadas (mínimo 0)"; exit}')
            fijas=${fijas:-"existen"}
          fi
          {
            echo "### Costos de staging — acción: \`${ACCION}\`"
            echo ""
            echo "| Recurso | Estado ahora |"
            echo "|---|---|"
            echo "| Marca guardada | **${marca}** |"
            echo "| Cloud SQL | ${sql} |"
            echo "| Redis (Memorystore) | ${redis} |"
            echo "| Conector VPC | ${conector} |"
            echo "| Instancias fijas de los servicios | ${fijas} |"
            echo ""
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Plan
        if: env.ACCION != 'estado'
        working-directory: codigo/infra
        run: |
          set -euo pipefail
          extra=()
          if [ "$ACCION" = "apagar" ]; then
            extra=(-var=cloud_sql_encendida=false -var=redis_encendida=false -var=instancias_fijas_encendidas=false)
          fi
          terraform plan -var-file=staging.tfvars "${extra[@]}" -out=plan.bin
          terraform show -json plan.bin > plan.json
      - name: Revisar el plan (apagar solo puede borrar Redis y su conector; encender, solo la versión «apagado» de sus secretos)
        if: env.ACCION != 'estado'
        working-directory: codigo/infra
        run: |
          set -euo pipefail
          revisar=../../herramientas/scripts/revisar_plan.py
          if [ "$ACCION" = "apagar" ]; then
            python3 "$revisar" plan.json \
              --solo-destruir '^google_redis_instance\.' \
              --solo-destruir '^google_vpc_access_connector\.' \
              --solo-destruir '^google_secret_manager_secret_version\.redis_url' | tee -a "$GITHUB_STEP_SUMMARY"
          else
            # Al encender se destruye solo la versión «apagado» de los secretos de Redis (la real, más nueva, la reemplaza).
            python3 "$revisar" plan.json \
              --solo-destruir '^google_secret_manager_secret_version\.redis_url_apagado' | tee -a "$GITHUB_STEP_SUMMARY"
          fi
      - name: Aplicar
        if: env.ACCION != 'estado'
        working-directory: codigo/infra
        run: terraform apply -parallelism=3 plan.bin
      - name: Guardar el estado y resumir
        if: env.ACCION != 'estado'
        run: |
          set -euo pipefail
          if [ "$ACCION" = "apagar" ]; then nuevo=apagado; else nuevo=encendido; fi
          printf '%s' "$nuevo" | gcloud storage cp - "gs://${PROYECTO}-tfstate/solventa-backend/costos/estado"
          if [ "$nuevo" = "apagado" ]; then
            cat >> "$GITHUB_STEP_SUMMARY" <<'EOF'

          **Apagado.** Cloud SQL quedó detenida (conserva los datos; solo se paga el disco), Redis y su conector VPC se
          borraron y los servicios volvieron a mínimo 0 instancias (el primer uso tras un rato sin tráfico tarda). Los
          servicios que dependen de Cloud SQL y Redis no atenderán hasta que lo vuelvas a encender.

          Para volver a subirlo: *Actions → Costos staging → Run workflow → `encender`* (unos 10-15 minutos).
          EOF
          else
            cat >> "$GITHUB_STEP_SUMMARY" <<'EOF'

          **Encendido.** Cloud SQL en marcha, los servicios de nuevo con su instancia fija (cobran por hora) y, si
          `crear_redis` está en `true` en `infra/staging.tfvars`, Redis y su
          conector recreados. Los servicios toman las URLs nuevas al arrancar su próxima revisión: si alguno sigue
          fallando, lanza *Deploy staging* para ese servicio.

          Para volver a apagarlo: *Actions → Costos staging → Run workflow → `apagar`*.
          EOF
          fi
      - name: Si falló
        if: failure()
        run: |
          {
            echo ""
            echo "### ❌ No se completó"
            echo ""
            echo "No se guardó ningún estado nuevo. Revisa el paso que falló. Si el botón no sirve, \`infra/README.md\`"
            echo "(sección «Apagar y encender lo que cuesta») explica cómo hacerlo a mano desde Cloud Shell."
          } >> "$GITHUB_STEP_SUMMARY"
