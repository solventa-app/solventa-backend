name: Deploy staging

# Despliega a staging lo que llegó a `main` (un release o un hotfix, git-flow ADR-08), SOLO después de que CI pase
# (workflow_run), o a mano desde `main`. `develop` integra pero NO despliega.
# Flujo (ADR-07):  construir UNA vez (imagen = SHA)  ->  migrar la base (Cloud Run Job, misma imagen)
#                  ->  revisión nueva SIN tráfico  ->  prueba de humo sobre ella  ->  promover.
# Si algo falla antes de "promover", staging sigue sirviendo la revisión anterior.
# Al final, el job `informe` deja un informe en Markdown (qué quedó corriendo, URL y qué hacer) en el resumen de la
# ejecución y como artefacto `informe-despliegue-<n>`; ver scripts/informe_despliegue.py.
# Si el merge cambió infra/ o .github/servicios.json, ANTES de construir se aplica Terraform (etapa `infra`, ADR-09):
# plan -> guardia contra destrucciones (scripts/revisar_plan.py) -> apply. Un servicio nuevo existe antes de desplegarlo
# y no hay carrera entre Terraform y `gcloud run deploy`. Si `infra` falla, no se despliega nada.
#
# APAGADO por defecto: no hace nada hasta que existan estas variables del repositorio
# (Settings > Secrets and variables > Actions > Variables):
#   GCP_PROJECT_ID, GCP_WIF_PROVIDER, GCP_DEPLOY_SA   salen de `terraform output` (infra/README.md)
#   GCP_PROTECCION_GASTO = activa                     confirma que la protección de gasto está instalada
#   GCP_TERRAFORM_SA, GCP_BILLING_ACCOUNT_ID          solo para la etapa `infra` (outputs de Terraform y cuenta de facturación)
#   GCP_REGION (opcional, us-central1), GCP_REGISTRY_REPO (opcional, solventa-backend)
on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    # Solo `main`. Ojo: en workflow_run GitHub toma como ref la rama por defecto (develop), no la del CI, así que los
    # entornos `staging` e `infra-staging` aceptan `main` y `develop`; que solo `main` despliegue lo garantiza este filtro
    # y la condición de `preparar` para la ejecución manual, no el entorno.
    branches: [main]
  workflow_dispatch:
    inputs:
      servicios:
        description: 'Servicios a desplegar separados por coma (ej. auth,risk) o "todos"'
        required: true
        default: todos
      infra:
        description: 'Aplicar también Terraform (infra/) antes de desplegar'
        type: boolean
        default: false
      permitir_destruir:
        description: 'Permitir que Terraform destruya o reemplace recursos (solo si ya revisaste el plan)'
        type: boolean
        default: false

# Un solo despliegue a la vez y nunca se corta a medias (podría dejar una migración sin su código).
concurrency:
  group: deploy-staging
  cancel-in-progress: false

permissions:
  contents: read

env:
  PROYECTO: ${{ vars.GCP_PROJECT_ID }}
  REGION: ${{ vars.GCP_REGION || 'us-central1' }}
  REPOSITORIO: ${{ vars.GCP_REGISTRY_REPO || 'solventa-backend' }}
  # En workflow_run, github.sha es el último commit de la rama por defecto (develop), no el que validó CI: se usa el de CI.
  SHA: ${{ github.event.workflow_run.head_sha || github.sha }}

jobs:
  preparar:
    if: >-
      vars.GCP_PROJECT_ID != '' && vars.GCP_PROTECCION_GASTO == 'activa' &&
      ((github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main') ||
      github.event.workflow_run.conclusion == 'success')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      servicios: ${{ steps.sel.outputs.servicios }}
      migraciones: ${{ steps.sel.outputs.migraciones }}
      infra: ${{ steps.infra.outputs.infra }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.SHA }}
          fetch-depth: 2
      - name: Qué servicios se despliegan
        id: sel
        env:
          EVENTO: ${{ github.event_name }}
          ENTRADA: ${{ inputs.servicios }}
        run: |
          set -euo pipefail
          if [ "$EVENTO" = "workflow_dispatch" ] && [ "$ENTRADA" = "todos" ]; then
            python scripts/seleccionar_servicios.py todos >> "$GITHUB_OUTPUT"
          elif [ "$EVENTO" = "workflow_dispatch" ]; then
            python scripts/seleccionar_servicios.py lista "$ENTRADA" >> "$GITHUB_OUTPUT"
          else
            # Merge commit de un release o hotfix en main: su primer padre es main antes del merge, así que el diff es todo
            # lo liberado. Si entra de otra forma (p. ej. un commit directo), usa "Run workflow" desde main.
            python scripts/seleccionar_servicios.py cambios "${SHA}^" "$SHA" >> "$GITHUB_OUTPUT"
          fi
          cat "$GITHUB_OUTPUT"
      - name: ¿Hay que aplicar Terraform?
        id: infra
        env:
          EVENTO: ${{ github.event_name }}
          ENTRADA: ${{ inputs.infra }}
        run: |
          set -euo pipefail
          if [ "$EVENTO" = "workflow_dispatch" ]; then
            echo "infra=${ENTRADA}" >> "$GITHUB_OUTPUT"
          elif git diff --name-only "${SHA}^" "$SHA" | grep -qE '^(infra/|\.github/servicios\.json$)'; then
            echo "infra=true" >> "$GITHUB_OUTPUT"
          else
            echo "infra=false" >> "$GITHUB_OUTPUT"
          fi
          grep '^infra=' "$GITHUB_OUTPUT"

  costos:
    # Lee la marca de costos («apagado» | «encendido», workflow `Costos staging`). Solo la cuenta de Terraform puede
    # leer el bucket del estado (contiene secretos), así que se lee aquí y se comparte por salida: `infra` la usa para
    # no volver a encender lo apagado y `migrar` para avisar con claridad si Cloud SQL está detenida.
    needs: preparar
    runs-on: ubuntu-latest
    timeout-minutes: 5
    environment: infra-staging
    permissions:
      contents: read
      id-token: write
    outputs:
      estado: ${{ steps.leer.outputs.estado }}
    steps:
      - uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3
        with:
          workload_identity_provider: ${{ vars.GCP_WIF_PROVIDER }}
          service_account: ${{ vars.GCP_TERRAFORM_SA }}
      - uses: google-github-actions/setup-gcloud@aa5489c8933f4cc7a4f7d45035b3b1440c9c10db # v3
      - name: Leer la marca
        id: leer
        run: |
          set -uo pipefail
          url="gs://${PROYECTO}-tfstate/solventa-backend/costos/estado"
          if salida=$(gcloud storage cat "$url" 2>&1); then
            estado=$(printf '%s' "$salida" | tr -d '[:space:]')
          elif printf '%s' "$salida" | grep -q -i -E 'matched no objects|not found|404'; then
            estado=encendido
          else
            echo "::error title=Costos::No pude leer el estado de los costos: $salida"
            exit 1
          fi
          echo "estado=$estado" >> "$GITHUB_OUTPUT"
          if [ "$estado" = "apagado" ]; then
            echo "### Costos de staging: **apagados** (Cloud SQL detenida y sin Redis). Para encenderlos: workflow *Costos staging*." >> "$GITHUB_STEP_SUMMARY"
          fi

  infra:
    # Aplica la infraestructura (Terraform) con una identidad distinta y más potente que la de despliegue,
    # en su propio entorno de GitHub (`infra-staging`): ahí se pueden exigir revisores antes de cada apply.
    needs: [preparar, costos]
    if: needs.preparar.outputs.infra == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: infra-staging
    permissions:
      contents: read
      id-token: write
    defaults:
      run:
        working-directory: infra
    env:
      TF_INPUT: "0"
      TF_IN_AUTOMATION: "1"
      TF_VAR_project_id: ${{ vars.GCP_PROJECT_ID }}
      TF_VAR_billing_account_id: ${{ vars.GCP_BILLING_ACCOUNT_ID }}
      TF_VAR_mongodb_atlas_org_id: ${{ vars.MONGODB_ATLAS_ORG_ID }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.SHA }}
      - uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3
        with:
          workload_identity_provider: ${{ vars.GCP_WIF_PROVIDER }}
          service_account: ${{ vars.GCP_TERRAFORM_SA }}
      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_wrapper: false
      - run: terraform init
      - uses: google-github-actions/setup-gcloud@aa5489c8933f4cc7a4f7d45035b3b1440c9c10db # v3
      # Las claves de API de MongoDB Atlas viven SOLO en Secret Manager (el equipo las carga una vez; ver
      # infra/README.md, «MongoDB Atlas»). Se leen aquí, se enmascaran y se pasan a Terraform. Si todavía no
      # existen, no pasa nada mientras `crear_mongo_atlas` siga en `false`.
      - name: Credenciales de MongoDB Atlas (desde Secret Manager)
        run: |
          set -uo pipefail
          for par in MONGODB_ATLAS_PUBLIC_KEY:mongodb-atlas-public-key MONGODB_ATLAS_PRIVATE_KEY:mongodb-atlas-private-key; do
            variable=${par%%:*}
            secreto=${par#*:}
            if valor=$(gcloud secrets versions access latest --secret="$secreto" --project="$PROYECTO" 2>/dev/null); then
              echo "::add-mask::$valor"
              echo "$variable=$valor" >> "$GITHUB_ENV"
            else
              echo "No hay $secreto en Secret Manager (solo hace falta si crear_mongo_atlas = true)."
            fi
          done
      # Cada despliegue deja una revisión con etiqueta `sha-…` y una revisión con etiqueta mantiene sus instancias mínimas:
      # se acumularon 3 a 6 por servicio, con 1 vCPU cada una, y sumadas pasaron la cuota de 20 vCPU de la región
      # (`Quota exceeded for total allowable CPU`, 2026-10-19/20). Sin etiqueta y sin tráfico, la revisión escala a cero.
      - name: Liberar las etiquetas de revisiones viejas
        run: |
          set -euo pipefail
          for servicio in $(gcloud run services list --region "$REGION" --project "$PROYECTO" --format='value(metadata.name)'); do
            etiquetas=$(gcloud run services describe "$servicio" --region "$REGION" --project "$PROYECTO" --format=json \
              | jq -r '[.status.traffic[]? | .tag // empty] | join(",")')
            if [ -n "$etiquetas" ]; then
              gcloud run services update-traffic "$servicio" --region "$REGION" --project "$PROYECTO" --remove-tags "$etiquetas" --quiet
            fi
          done
      # Lo que cobra por hora (Cloud SQL, Redis, instancias fijas) puede estar APAGADO a propósito (workflow `Costos staging`).
      # Un release no debe volver a encenderlo: la marca guardada (job `costos`) manda sobre `staging.tfvars`.
      - name: Plan
        env:
          COSTOS: ${{ needs.costos.outputs.estado }}
        run: |
          set -euo pipefail
          extra=()
          if [ "$COSTOS" = "apagado" ]; then
            extra=(-var=cloud_sql_encendida=false -var=redis_encendida=false -var=instancias_fijas_encendidas=false)
          fi
          terraform plan -var-file=staging.tfvars "${extra[@]}" -out=plan.bin
          terraform show -json plan.bin > plan.json
      - name: Revisar el plan (no se destruye nada sin decisión explícita)
        env:
          PERMITIR: ${{ inputs.permitir_destruir }}
        run: |
          set -euo pipefail
          args=()
          if [ "$PERMITIR" = "true" ]; then args+=(--permitir-destruir); fi
          python3 ../scripts/revisar_plan.py plan.json "${args[@]}" | tee -a "$GITHUB_STEP_SUMMARY"
      # De a pocos: cada servicio que cambia crea una revisión nueva y su instancia de arranque cuenta contra la cuota
      # de CPU de la región (20 vCPU). Con los 10 en paralelo se pasó (2026-10-18), y las instancias fijas ya ocupan 9. Con 3 en
      # paralelo también se pasó (2026-10-19, `Quota exceeded for total allowable CPU`): se aplica de a uno.
      - name: Aplicar
        run: terraform apply -parallelism=1 plan.bin
      - name: Leer URL del API Gateway (si existe)
        id: gw_out
        run: |
          gw=$(terraform output -raw gateway_url 2>/dev/null || true)
          echo "gateway_url=${gw}" >> "$GITHUB_OUTPUT"
          # Queda en el resumen de Terraform aunque después falle construir, migrar o desplegar.
          if [ -n "$gw" ]; then
            {
              echo "## API Gateway (salida de Terraform)"
              echo "- **\`gateway_url\`:** \`${gw}\`"
              echo "- **GraphQL Web:** \`${gw}/graphql/web\`"
              echo "- **Salud:** \`${gw}/health\`"
            } >> "$GITHUB_STEP_SUMMARY"
          fi

  construir:
    # Construir una vez: la imagen que pasó CI es la que llega a staging (etiqueta = SHA, nunca "latest").
    needs: [preparar, infra, costos]
    # `infra` se omite cuando el merge no tocó Terraform; si falló, no se construye ni se despliega nada.
    if: ${{ !cancelled() && needs.preparar.result == 'success' && needs.preparar.outputs.servicios != '[]' && needs.costos.result == 'success' && contains(fromJSON('["success","skipped"]'), needs.infra.result) }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: staging
    permissions:
      contents: read
      id-token: write
    strategy:
      fail-fast: true
      matrix:
        servicio: ${{ fromJSON(needs.preparar.outputs.servicios) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.SHA }}
      - uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3
        with:
          workload_identity_provider: ${{ vars.GCP_WIF_PROVIDER }}
          service_account: ${{ vars.GCP_DEPLOY_SA }}
      - uses: google-github-actions/setup-gcloud@aa5489c8933f4cc7a4f7d45035b3b1440c9c10db # v3
      - name: Construir y publicar la imagen (si no existe ya para este SHA)
        env:
          NOMBRE: ${{ matrix.servicio }}
        run: |
          set -euo pipefail
          imagen="${REGION}-docker.pkg.dev/${PROYECTO}/${REPOSITORIO}/${NOMBRE}:${SHA}"
          if gcloud artifacts docker images describe "$imagen" >/dev/null 2>&1; then
            echo "La imagen ya existe para este SHA: se reutiliza sin reconstruir."
            exit 0
          fi
          ruta=$(jq -r --arg n "$NOMBRE" '.[] | select(.nombre == $n) | .ruta' .github/servicios.json)
          gcloud auth configure-docker "${REGION}-docker.pkg.dev" --quiet
          docker build --label "org.opencontainers.image.revision=${SHA}" -t "$imagen" "$ruta"
          docker push "$imagen"

  migrar:
    # La base se migra ANTES de que la revisión nueva reciba tráfico, mientras la anterior sigue
    # sirviendo: por eso toda migración debe ser compatible hacia atrás (expandir/contraer, ADR-07).
    # Se ejecuta como Cloud Run Job con la MISMA imagen que se va a desplegar.
    needs: [preparar, construir, costos]
    # `!cancelled()` es imprescindible: sin una función de estado, GitHub añade `success()`, que cuenta también a los
    # antecesores de `construir`. Con `infra` omitida (lo normal: casi ningún release toca infra/) saltaba `migrar`
    # aunque hubiera migraciones, y `desplegar` seguía adelante sin migrar.
    if: ${{ !cancelled() && needs.preparar.result == 'success' && needs.construir.result == 'success' && needs.costos.result == 'success' && needs.preparar.outputs.migraciones != '[]' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: staging
    permissions:
      contents: read
      id-token: write
    strategy:
      fail-fast: true
      matrix:
        servicio: ${{ fromJSON(needs.preparar.outputs.migraciones) }}
    steps:
      # Con los costos apagados Cloud SQL está DETENIDA: migrar `auth`, `payments`, `policy`, `almacenamiento` u `onboarding` fallaría con un error de conexión poco
      # claro. Se avisa antes de gastar tiempo. (`risk` usa MongoDB Atlas, que no se apaga.)
      - name: ¿Cloud SQL está apagada?
        if: matrix.servicio == 'auth' || matrix.servicio == 'payments' || matrix.servicio == 'policy' || matrix.servicio == 'almacenamiento' || matrix.servicio == 'onboarding'
        env:
          COSTOS: ${{ needs.costos.outputs.estado }}
        run: |
          if [ "$COSTOS" = "apagado" ]; then
            echo "::error title=Costos apagados::Cloud SQL está detenida y no se puede migrar. Ejecuta Actions > Costos staging > encender y vuelve a lanzar este despliegue."
            exit 1
          fi
      - uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3
        with:
          workload_identity_provider: ${{ vars.GCP_WIF_PROVIDER }}
          service_account: ${{ vars.GCP_DEPLOY_SA }}
      - uses: google-github-actions/setup-gcloud@aa5489c8933f4cc7a4f7d45035b3b1440c9c10db # v3
      - name: Migrar (Cloud Run Job)
        env:
          NOMBRE: ${{ matrix.servicio }}
        run: |
          set -euo pipefail
          imagen="${REGION}-docker.pkg.dev/${PROYECTO}/${REPOSITORIO}/${NOMBRE}:${SHA}"
          gcloud run jobs update "migrar-${NOMBRE}" --image "$imagen" --region "$REGION"
          gcloud run jobs execute "migrar-${NOMBRE}" --region "$REGION" --wait

  desplegar:
    needs: [preparar, construir, migrar]
    # Si hay migraciones, `migrar` debe haber TERMINADO BIEN: omitida o fallida, no se despliega nada (un servicio
    # nuevo contra un esquema sin migrar es peor que no desplegar). Solo se acepta `migrar` omitida cuando no había
    # ninguna migración que correr.
    if: ${{ !cancelled() && needs.construir.result == 'success' && (needs.migrar.result == 'success' || (needs.migrar.result == 'skipped' && needs.preparar.outputs.migraciones == '[]')) }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: staging
    permissions:
      contents: read
      id-token: write
    strategy:
      fail-fast: false
      # De a pocos: cada despliegue crea una revisión que arranca una instancia y cuenta contra la cuota de CPU de la
      # región (20 vCPU), que las instancias fijas ya ocupan en parte.
      max-parallel: 4
      matrix:
        servicio: ${{ fromJSON(needs.preparar.outputs.servicios) }}
    steps:
      - uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3
        with:
          workload_identity_provider: ${{ vars.GCP_WIF_PROVIDER }}
          service_account: ${{ vars.GCP_DEPLOY_SA }}
      - uses: google-github-actions/setup-gcloud@aa5489c8933f4cc7a4f7d45035b3b1440c9c10db # v3
      - name: Revisión nueva SIN tráfico
        id: rev
        env:
          NOMBRE: ${{ matrix.servicio }}
        run: |
          set -euo pipefail
          imagen="${REGION}-docker.pkg.dev/${PROYECTO}/${REPOSITORIO}/${NOMBRE}:${SHA}"
          etiqueta="sha-${SHA::7}"
          gcloud run deploy "$NOMBRE" --image "$imagen" --region "$REGION" \
            --no-traffic --tag "$etiqueta" --update-labels "commit-sha=${SHA}" --quiet
          url=$(gcloud run services describe "$NOMBRE" --region "$REGION" --format=json \
            | jq -r --arg t "$etiqueta" '.status.traffic[] | select(.tag == $t) | .url')
          echo "url=$url" >> "$GITHUB_OUTPUT"
      # Token de identidad para llamar a servicios privados (el audience es el nombre del servicio:
      # Terraform lo registra como custom audience, que vale también para las URL con etiqueta).
      - name: Token de identidad para la prueba de humo
        id: idt
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3
        with:
          workload_identity_provider: ${{ vars.GCP_WIF_PROVIDER }}
          service_account: ${{ vars.GCP_DEPLOY_SA }}
          token_format: id_token
          id_token_audience: ${{ matrix.servicio }}
          id_token_include_email: true
      - name: Prueba de humo sobre la revisión nueva
        env:
          URL: ${{ steps.rev.outputs.url }}
          TOKEN: ${{ steps.idt.outputs.id_token }}
        run: |
          set -euo pipefail
          curl -fsS --retry 5 --retry-delay 3 --retry-connrefused \
            -H "Authorization: Bearer ${TOKEN}" "${URL}/health"
      - name: Promover (100 % del tráfico a la revisión nueva)
        env:
          NOMBRE: ${{ matrix.servicio }}
        run: gcloud run services update-traffic "$NOMBRE" --region "$REGION" --to-latest
      # La etiqueta solo servía para la prueba de humo: quitarla deja que la revisión anterior escale a cero.
      - name: Quitar las etiquetas de revisiones
        env:
          NOMBRE: ${{ matrix.servicio }}
        run: |
          set -euo pipefail
          etiquetas=$(gcloud run services describe "$NOMBRE" --region "$REGION" --format=json \
            | jq -r '[.status.traffic[]? | .tag // empty] | join(",")')
          if [ -n "$etiquetas" ]; then
            gcloud run services update-traffic "$NOMBRE" --region "$REGION" --remove-tags "$etiquetas" --quiet
          fi
      - name: Resumen
        env:
          NOMBRE: ${{ matrix.servicio }}
        run: echo "- **${NOMBRE}** desplegado en staging (commit \`${SHA::7}\`)" >> "$GITHUB_STEP_SUMMARY"

  informe:
    # Informe del despliegue en Markdown: qué quedó corriendo, sus URL y qué hacer ahora. Corre SIEMPRE que `preparar` pasó,
    # también si una etapa falló, y lee el estado REAL de Cloud Run (cada despliegue deja la etiqueta `commit-sha`), no lo
    # previsto. Va al resumen de la ejecución y se guarda como artefacto. Si el informe mismo falla, no tumba el despliegue.
    needs: [preparar, infra, construir, migrar, desplegar]
    if: ${{ !cancelled() && needs.preparar.result == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    continue-on-error: true
    environment: staging
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.SHA }}
          fetch-depth: 0 # tags y ramas, para saber si falta reintegrar main en develop o poner el tag del sprint
      - uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3
        with:
          workload_identity_provider: ${{ vars.GCP_WIF_PROVIDER }}
          service_account: ${{ vars.GCP_DEPLOY_SA }}
      - uses: google-github-actions/setup-gcloud@aa5489c8933f4cc7a4f7d45035b3b1440c9c10db # v3
      - name: Humo final contra el API Gateway (si gateway_url existe)
        id: gw
        run: |
          set -uo pipefail
          host=$(gcloud api-gateway gateways describe solventa-gateway --location="$REGION" --project="$PROYECTO" --format='value(defaultHostname)' 2>/dev/null || true)
          if [ -n "$host" ]; then
            gateway_url="https://${host}"
            echo "gateway_url=${gateway_url}" >> "$GITHUB_OUTPUT"
            curl -fsS --max-time 5 --retry 3 --retry-delay 2 "${gateway_url}/health"
          else
            echo "gateway_url=" >> "$GITHUB_OUTPUT"
          fi
      - name: Estado real de Cloud Run
        run: gcloud run services list --region "$REGION" --format=json > "$RUNNER_TEMP/cloud-run.json"
      - name: Generar el informe
        env:
          NEEDS: ${{ toJSON(needs) }}
          EVENTO: ${{ github.event_name }}
          REPO: ${{ github.repository }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          GATEWAY_URL: ${{ steps.gw.outputs.gateway_url }}
        run: |
          set -euo pipefail
          printf '%s' "$NEEDS" > "$RUNNER_TEMP/needs.json"
          adelante=$(git rev-list --count origin/develop..origin/main 2>/dev/null || echo 0)
          tags=$(git tag --points-at "$SHA" | tr '\n' ' ')
          python3 scripts/informe_despliegue.py --sha "$SHA" --repo "$REPO" --evento "$EVENTO" \
            --needs "$RUNNER_TEMP/needs.json" --cloud-run "$RUNNER_TEMP/cloud-run.json" \
            --run-url "$RUN_URL" --proyecto "$PROYECTO" --region "$REGION" \
            --main-adelante "$adelante" --tags "$tags" > informe-despliegue.md
          if [ -n "$GATEWAY_URL" ]; then
            {
              echo ""
              echo "## Puerta pública: API Gateway (HA-LAT-004)"
              echo ""
              echo "- **\`gateway_url\`:** \`${GATEWAY_URL}\` (corte duro de 700 ms)"
              echo "- **GraphQL Web:** \`${GATEWAY_URL}/graphql/web\`"
              echo "- **Salud:** \`${GATEWAY_URL}/health\`"
            } >> informe-despliegue.md
          fi
          cat informe-despliegue.md >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: informe-despliegue-${{ github.run_number }}-${{ github.run_attempt }}
          path: informe-despliegue.md
          retention-days: 90
