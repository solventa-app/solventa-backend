name: Seguridad

# Reporte consolidado de seguridad del backend, con el mismo estilo que el `seguridad.yml` del móvil. Corre en
# todo PR, en cada push a develop, cada lunes (una vulnerabilidad nueva puede aparecer sin que cambie el código) y a
# mano (Actions → Seguridad → Run workflow).
#
# Es INFORMATIVO: ningún escaneo hace fallar el run. Cada job sube su resultado crudo como artefacto
# `seguridad-*` y el job `reporte` los junta (scripts/reporte_seguridad.py) en el resumen del run y en el artefacto
# `reporte-seguridad` (PDF, Markdown y JSON). Los checks bloqueantes siguen en ci.yml (secretos y actionlint).
#
# Las imágenes de contenedor y el DAST contra staging son lentos o dependen de staging: no corren en los PRs.
on:
  pull_request:
  push:
    branches: [develop]
  schedule:
    - cron: "0 12 * * 1"
  workflow_dispatch:

concurrency:
  group: seguridad-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  # Gateway público de staging (vercel.json de la web y docs/guia-siembra-siniestros-staging.md). Se puede cambiar con
  # la variable del repo STAGING_GATEWAY_URL sin tocar el workflow.
  GATEWAY: ${{ vars.STAGING_GATEWAY_URL || 'https://solventa-gateway-btxoyawl.uc.gateway.dev' }}

jobs:
  secretos:
    name: Secretos (gitleaks)
    # Todo el historial, no solo el último commit.
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Buscar secretos
        run: |
          mkdir -p resultados
          docker run --rm -v "$PWD:/repo" --entrypoint sh ghcr.io/gitleaks/gitleaks:v8.30.1 -c \
            'git config --global --add safe.directory /repo && gitleaks git /repo --no-banner --redact --exit-code 0 --report-format json --report-path /repo/resultados/gitleaks.json'
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: seguridad-secretos
          path: resultados/
          if-no-files-found: ignore

  dependencias:
    name: Dependencias (osv-scanner)
    # Todos los requirements.txt de servicios y stubs, requirements-dev.txt y uv.lock contra la base OSV.
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Vulnerabilidades conocidas
        run: |
          mkdir -p resultados
          # 0 = sin hallazgos, 1 = con hallazgos; cualquier otro código es un error y no se reporta como "0".
          codigo=0
          docker run --rm -v "$PWD:/repo" -w /repo ghcr.io/google/osv-scanner:v2.7.0 \
            scan source -r --format json --output-file resultados/osv.json . || codigo=$?
          if [ "$codigo" -gt 1 ]; then
            echo "::warning::osv-scanner terminó con código $codigo; el reporte lo marcará sin resultado"
            rm -f resultados/osv.json
          fi
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: seguridad-dependencias
          path: resultados/
          if-no-files-found: ignore

  sast:
    name: Código (Bandit y Semgrep)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.14"
      - name: Bandit
        # Sin las pruebas: ahí los assert y las claves de ejemplo son esperados.
        run: |
          mkdir -p resultados
          pip install --disable-pip-version-check --quiet bandit==1.9.4
          bandit -q -r services stubs -x '*/tests/*,*/test_*.py' -f json -o resultados/bandit.json || true
      - name: Semgrep
        run: |
          codigo=0
          docker run --rm -v "$PWD:/src" -w /src semgrep/semgrep:1.186.0 \
            semgrep scan --config p/python --metrics off --exclude tests --json --output resultados/semgrep.json \
            || codigo=$?
          if [ "$codigo" -gt 1 ]; then
            echo "::warning::Semgrep terminó con código $codigo; el reporte lo marcará sin resultado"
            rm -f resultados/semgrep.json
          fi
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: seguridad-sast
          path: resultados/
          if-no-files-found: ignore

  iac:
    name: Terraform y Dockerfiles (Trivy config)
    # infra/*.tf (buckets públicos, IAM amplio, cifrado) y los Dockerfile (usuario root, etc.). Las reglas que no
    # aplican a este proyecto se ignoran, con su motivo, en .trivyignore.
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Configuración insegura
        run: |
          mkdir -p resultados
          docker run --rm -v "$PWD:/repo" -w /repo aquasec/trivy:0.69.3 config --quiet --exit-code 0 \
            --ignorefile .trivyignore --format json --output resultados/trivy-config.json . \
            || rm -f resultados/trivy-config.json
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: seguridad-iac
          path: resultados/
          if-no-files-found: ignore

  servicios:
    name: Lista de imágenes
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      matriz: ${{ steps.lista.outputs.matriz }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          sparse-checkout: .github/servicios.json
          sparse-checkout-cone-mode: false
      - id: lista
        # .github/servicios.json es la fuente única de servicios (ADR-07).
        run: echo "matriz=$(jq -c '[.[] | {nombre, ruta}]' .github/servicios.json)" >> "$GITHUB_OUTPUT"

  imagenes:
    name: Imagen ${{ matrix.servicio.nombre }} (Trivy)
    # Construye la imagen igual que ci.yml y busca CVE del sistema operativo y de los paquetes de Python. El reporte
    # agrupa las CVE de la imagen base, que se repiten en todos los servicios.
    needs: servicios
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      max-parallel: 8
      matrix:
        servicio: ${{ fromJSON(needs.servicios.outputs.matriz) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Construir imagen
        working-directory: ${{ matrix.servicio.ruta }}
        run: docker build -q -t "${{ matrix.servicio.nombre }}:seguridad" .
      - name: Escanear imagen
        run: |
          mkdir -p resultados
          docker run --rm -v /var/run/docker.sock:/var/run/docker.sock -v "$PWD/resultados:/salida" \
            aquasec/trivy:0.69.3 image --quiet --exit-code 0 --scanners vuln --format json \
            --output "/salida/trivy-imagen-${{ matrix.servicio.nombre }}.json" "${{ matrix.servicio.nombre }}:seguridad" \
            || rm -f "resultados/trivy-imagen-${{ matrix.servicio.nombre }}.json"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: seguridad-imagen-${{ matrix.servicio.nombre }}
          path: resultados/
          if-no-files-found: ignore

  dast:
    name: Staging (OWASP ZAP baseline)
    # Escaneo pasivo (no ataca) del gateway de staging: headers, cookies, CORS y fugas de información. Si staging está
    # apagado, el reporte dice que no hubo resultado y el run sigue.
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: ¿Staging responde?
        id: vivo
        run: |
          if curl -s -o /dev/null --max-time 20 "$GATEWAY/graphql/web"; then
            echo "listo=true" >> "$GITHUB_OUTPUT"
          else
            echo "::warning::El gateway de staging ($GATEWAY) no responde; no se corre ZAP"
          fi
      - name: ZAP baseline
        if: steps.vivo.outputs.listo == 'true'
        run: |
          mkdir -p resultados && chmod 777 resultados
          # 0 = sin alertas, 1 = alertas FAIL, 2 = alertas WARN; 3 o más es un error de ZAP.
          for objetivo in graphql/web v1/graphql/app; do
            nombre="zap-$(echo "$objetivo" | tr '/' '-').json"
            codigo=0
            docker run --rm -v "$PWD/resultados:/zap/wrk:rw" ghcr.io/zaproxy/zaproxy:2.16.1 \
              zap-baseline.py -t "$GATEWAY/$objetivo" -I -m 2 -J "$nombre" || codigo=$?
            if [ "$codigo" -gt 2 ]; then
              echo "::warning::ZAP terminó con código $codigo en $objetivo"
              rm -f "resultados/$nombre"
            fi
          done
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: seguridad-dast
          path: resultados/*.json
          if-no-files-found: ignore

  reporte:
    name: Reporte consolidado
    needs: [secretos, dependencias, sast, iac, imagenes, dast]
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          sparse-checkout: scripts/reporte_seguridad.py
          sparse-checkout-cone-mode: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: seguridad-*
          path: resultados
      - name: Consolidar
        env:
          # Lo que debió correr en este evento: si falta su resultado, el reporte lo avisa.
          ESCANEOS_ESPERADOS: secretos,dependencias,sast-bandit,sast-semgrep,iac${{ github.event_name != 'pull_request' && ',imagenes,dast' || '' }}
        run: python3 scripts/reporte_seguridad.py consolidar resultados reporte-seguridad
      - name: PDF
        # Chrome viene instalado en ubuntu-latest.
        run: |
          google-chrome --headless=new --no-sandbox --disable-gpu --no-pdf-header-footer \
            --print-to-pdf=reporte-seguridad/reporte-seguridad.pdf "file://$PWD/reporte-seguridad/reporte-seguridad.html" \
            || echo "::warning::No se pudo generar el PDF; el reporte queda en Markdown y JSON"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: reporte-seguridad
          path: |
            reporte-seguridad/reporte-seguridad.pdf
            reporte-seguridad/reporte-seguridad.md
            reporte-seguridad/reporte-seguridad.json
          if-no-files-found: ignore
          retention-days: 30
