name: Título del PR

# El ruleset de `main` exige un status check llamado exactamente "Título del
# PR" (ver `gh api repos/.../rulesets/<id>`) — antes de este workflow no
# existía nada que lo reportara, así que esa regla del ruleset nunca se podía
# cumplir. Valida que el título siga Conventional Commits + la clave de Jira
# (docs/convenciones.md): `tipo(alcance): KAN-nn descripción`, con `alcance`
# opcional para commits que no son de un servicio puntual (p. ej. `chore`).

on:
  pull_request:
    types: [opened, edited, reopened, synchronize]

permissions:
  contents: read

jobs:
  valida:
    name: Título del PR
    runs-on: ubuntu-latest
    steps:
      - name: Verifica formato Conventional Commits + clave de Jira
        env:
          TITULO: ${{ github.event.pull_request.title }}
        run: |
          echo "Título del PR: $TITULO"
          PATRON='^(feat|fix|refactor|test|docs|chore|ci|infra)(\([a-zA-Z0-9_,./ -]+\))?: KAN-[0-9]+ .+'
          if ! echo "$TITULO" | grep -Eq "$PATRON"; then
            echo "::error::El título del PR debe seguir Conventional Commits con la clave de Jira (docs/convenciones.md), p. ej.: \`feat(auth): KAN-24 registra consentimiento append-only\`. Tipos válidos: feat, fix, refactor, test, docs, chore, ci, infra."
            exit 1
          fi
          echo "Título válido."
