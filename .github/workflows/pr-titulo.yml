name: Título del PR

# El título del PR es el mensaje del commit al hacer squash a main (trunk-based, 1 PR = 1 historia):
# Conventional Commits con alcance y clave de Jira. Ver docs/convenciones.md.
# Va en un workflow aparte para que editar el título no vuelva a correr todo el CI.
on:
  pull_request:
    types: [opened, edited, reopened, synchronize]

permissions: {}

jobs:
  titulo:
    name: Título del PR
    # Dependabot usa su propio formato.
    if: github.actor != 'dependabot[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Validar formato
        env:
          TITULO: ${{ github.event.pull_request.title }}
        run: |
          patron='^(feat|fix|refactor|test|docs|chore|ci|infra)\((bff|auth|risk|rating|payments|acl|stubs|contracts|infra|tests)\): KAN-[0-9]+ .+'
          if ! printf '%s' "$TITULO" | grep -Eq "$patron"; then
            echo "::error title=Título del PR::Formato esperado: tipo(alcance): KAN-N descripción. Ej.: feat(auth): KAN-24 registra consentimiento append-only"
            echo "Recibido: $TITULO"
            echo "Tipos: feat fix refactor test docs chore ci infra"
            echo "Alcances: bff auth risk rating payments acl stubs contracts infra tests"
            exit 1
          fi
