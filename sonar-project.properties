sonar.organization=global-spark
sonar.projectKey=global-spark_solventa-backend
sonar.projectName=Solventa Backend
sonar.sources=services,stubs
sonar.tests=services,stubs
sonar.test.inclusions=**/tests/**
sonar.exclusions=**/tests/**,**/__pycache__/**
sonar.python.version=3.12
# Un informe por servicio (job `cobertura` del CI), con las rutas ya desde la raíz del repo.
sonar.python.coverage.reportPaths=cobertura/*/coverage.xml
# Las migraciones se prueban contra el almacén real en el job `migraciones`, no con pytest.
sonar.coverage.exclusions=**/migrations/**
