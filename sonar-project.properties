sonar.organization=global-spark
sonar.projectKey=global-spark_solventa-backend
sonar.projectName=Solventa Backend
sonar.sources=services,stubs
sonar.tests=services,stubs
sonar.test.inclusions=**/tests/**
sonar.exclusions=**/tests/**,**/__pycache__/**
sonar.python.version=3.12
# Un informe por servicio (job `cobertura` del CI), con las rutas ya desde la raíz del repo.
sonar.python.coverage.reportPaths=cobertura/*/coverage.xml
# Las migraciones se prueban contra el almacén real en el job `migraciones`, no con pytest.
sonar.coverage.exclusions=**/migrations/**
# Duplicación: cada servicio es una imagen con su propio contexto de build y no hay paquete común
# (CLAUDE.md, «Reutiliza copiando, no enlazando»), así que estos módulos se copian a propósito en
# cada servicio. Se excluyen SOLO de la detección de duplicados; siguen analizándose como código
# (bugs, vulnerabilidades y mantenibilidad). RATING lleva una copia idéntica del motor de RISK (solo
# se excluye la de RATING). Un módulo nuevo que se copie entre servicios se agrega aquí.
sonar.cpd.exclusions=\
  **/app/observabilidad.py,\
  **/cifrado.py,\
  **/autenticacion_servicios.py,\
  **/bus_eventos.py,\
  **/planificador.py,\
  **/limites_plazo.py,\
  **/money.py,\
  services/rating/app/application/motor_scoring.py,\
  services/rating/app/application/motor_decision.py,\
  **/migrations/env.py,\
  **/migrations/__init__.py
