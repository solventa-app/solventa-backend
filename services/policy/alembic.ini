# Alembic de POLICY. La URL de la base NO se escribe aquí: sale de DATABASE_URL (migrations/env.py).
[alembic]
script_location = migrations
# Con esto, `alembic` encuentra el paquete `app` desde la carpeta del servicio aunque no se llame con
# `python -m` (una migración que use el cifrador de la aplicación lo necesita).
prepend_sys_path = .
# Revisiones secuenciales y legibles (0001, 0002...): `alembic revision -m "texto" --rev-id 0002`.
file_template = %%(rev)s_%%(slug)s

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
