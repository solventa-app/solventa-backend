"""
Contrato GraphQL del BFF (v0, Sprint 1: HU-W01 y HU-W05; v0.20 suma el onboarding de HU-M01; v0.22, el estado del
sistema de HU-W07. La API REST de los socios está aparte, en contracts/openapi/socios-v1.json).

Este archivo es la FUENTE DE VERDAD del contrato con `solventa-frontend`.
Reglas (ver contracts/README.md): solo cambios ADITIVOS; para quitar algo se marca @deprecated
y se retira un sprint después; todo cambio se anota en contracts/CHANGELOG.md.
"""

scalar DateTime

# ---------- Consentimiento (CA-W01-01/02/08) ----------

enum EstadoConsentimiento {
  VIGENTE
  REVOCADO
  VENCIDO
}

type Consentimiento {
  id: ID!
  finalidad: String!
  versionTexto: String!
  otorgadoEn: DateTime!
  revocadoEn: DateTime
  venceEn: DateTime!
  vigente: Boolean!
  estado: EstadoConsentimiento!
}

input ConsentimientoInput {
  finalidad: String!
  versionTexto: String!
  documentoIdentidad: String = null
  tipoDato: String = null
  fuenteDatos: String = null
  canal: String = null
  # v0.38 (T20): tipo del documento (de `Jurisdiccion.tiposDocumento`) y país (uno de los siete). Con alguno de
  # los dos, el número se valida con el formato del país y ambos entran al titular; sin ninguno, cédula colombiana.
  tipoDocumento: String = null
  pais: String = null
}

# ---------- Oferta (CA-W01-03/04/05/06) ----------

enum TipoOferta {
  COMPLETA
  PRELIMINAR
}

enum EstadoFuente {
  OK
  CACHE
  FALLO
}

enum NivelRiesgo {
  BAJO
  MEDIO
  ALTO
}

type PerfilRiesgo {
  score: Int!
  nivelRiesgo: NivelRiesgo!
  fechaVigencia: DateTime!
}

enum MotivoErrorOferta {
  # v0.42 (auto): la placa no existe en RUNT, o el vehículo no se puede asegurar (más de 15 años, limitación o hurto
  # vigente). El mensaje dice cuál.
  VEHICULO_NO_ENCONTRADO
  VEHICULO_NO_ASEGURABLE
  CONSENTIMIENTO_NO_VIGENTE
  DATOS_INSUFICIENTES
  FUENTES_NO_DISPONIBLES
}

type Monto {
  valor: String! # decimal como texto, nunca float
  moneda: String!
}

type RangoPrima {
  minima: Monto!
  maxima: Monto!
}

type FactorScore {
  nombre: String!
  peso: Float!
}

type FuenteConsultada {
  id: ID!
  nombre: String!
  origen: OrigenFuente!
  estado: EstadoFuente!
  capturadoEn: DateTime # presente si el dato viene de caché
}

enum OrigenFuente {
  OPEN_FINANCE
  OPEN_DATA
}

# ---------- Historial de fuentes consultadas (v0.45, QA 2026-11-10, Q-08) ----------
# Cada cotización deja un renglón en RISK (colección `consultas`): quién la hizo, cuándo, a qué documento (enmascarado),
# qué tipo de oferta salió y el ESTADO de cada fuente, nunca sus datos. Se conserva aunque el consentimiento se revoque
# o venza (el perfil sí se borra). Solo lo ve el ASESOR que cotizó: el filtro sale de su token.
type ConsultaFuentes {
  id: ID!
  creadaEn: DateTime!
  documentoEnmascarado: String! # «10••••3040»; el nombre del titular no se conoce al cotizar
  tipoOferta: TipoOferta!
  producto: Producto!
  ofertaId: ID
  fuentes: [FuenteConsultada!]!
}

type PaginaConsultasFuentes {
  consultas: [ConsultaFuentes!]! # de la más reciente a la más antigua
  total: Int!
  pagina: Int!
  tamano: Int!
}

type Oferta {
  id: ID!
  tipo: TipoOferta!
  prima: Monto # presente en la oferta COMPLETA
  rangoPrima: RangoPrima # presente en la oferta PRELIMINAR
  cobertura: Monto!
  desgloseScore: [FactorScore!]!
  fuentes: [FuenteConsultada!]!
  perfilRiesgo: PerfilRiesgo
  # v0.42 (póliza de auto): VIDA_DEUDOR en las ofertas de `solicitarOferta`. En AUTO, `cobertura` es el valor comercial
  # del vehículo, `desgloseScore` va vacío y los factores de la tarifa vienen en `factoresTarifa`.
  producto: Producto!
  vehiculo: VehiculoAsegurado # solo AUTO
  coberturas: [CoberturaAuto!]! # solo AUTO; vacía en VIDA_DEUDOR
  factoresTarifa: [FactorTarifa!]! # solo AUTO; vacía en VIDA_DEUDOR
}

# ---------- Póliza de auto (v0.42, docs/plan-poliza-auto.md) ----------
# Se cotiza con `solicitarOfertaAuto` (los datos del crédito hipotecario no aplican) y desde la oferta el recorrido es el
# mismo de hoy: aceptarOferta, firma, pago y emisión. Los datos del vehículo salen de RUNT, la guía Fasecolda y la
# siniestralidad por placa, siempre por el ACL Worker y con el consentimiento registrado antes (regla 7).

enum Producto {
  VIDA_DEUDOR
  AUTO
}

enum UsoVehiculo {
  PARTICULAR
  COMERCIAL
}

enum DeducibleAuto {
  DIEZ_POR_CIENTO # 10 % de la pérdida, mínimo 1 SMMLV
  SIN_DEDUCIBLE
}

enum TipoCobertura {
  RESPONSABILIDAD_CIVIL
  PERDIDA_TOTAL_DANOS
  PERDIDA_PARCIAL_DANOS
  PERDIDA_TOTAL_HURTO
  PERDIDA_PARCIAL_HURTO
  ASISTENCIA # grúa, mecánico y conductor elegido
}

input SolicitudOfertaAutoInput {
  consentimientoId: ID!
  # Como en `SolicitudOfertaInput`: obligatorio para un ASESOR; un CLIENTE con documento en su cuenta no lo manda.
  documentoIdentidad: String = null
  tipoDocumento: String = null
  pais: String = null
  # Placa colombiana: 3 letras y 3 números (ABC123) o, en motos, 3 letras, 2 números y 1 letra (ABC12D). Se guarda cifrada.
  placa: String!
  kilometrajeAnual: Int! # declarado por el cliente; se contrasta con el odómetro de la última revisión (RUNT)
  ciudadCirculacion: String!
  uso: UsoVehiculo! = PARTICULAR
  deducible: DeducibleAuto! = DIEZ_POR_CIENTO
}

type VehiculoAsegurado {
  placaEnmascarada: String! # «ABC•••»; la placa completa nunca sale del backend
  marca: String!
  linea: String!
  modelo: Int! # año de fabricación
  clase: String! # AUTOMOVIL, CAMIONETA, CAMPERO, MOTOCICLETA
  uso: UsoVehiculo!
  valorComercial: Monto! # guía Fasecolda
  ciudadCirculacion: String!
  kilometrajeAnual: Int!
  deducible: DeducibleAuto!
}

type CoberturaAuto {
  tipo: TipoCobertura!
  valorAsegurado: Monto # null en ASISTENCIA
  deducible: String # texto legible («10 % mín. 1 SMMLV»); null si no aplica
}

# Un factor de la tarifa de auto (contracts/tarifas-auto.json): nombre estable y multiplicador aplicado.
type FactorTarifa {
  nombre: String! # ANTIGUEDAD, KILOMETRAJE, INDICE_HURTO, SINIESTRALIDAD, CIUDAD, DEDUCIBLE, USO
  factor: Float!
  detalle: String # «3 años», «12.000 km/año», «índice alto»…
}

type ErrorOferta {
  mensaje: String!
  puedeReintentar: Boolean!
  motivo: MotivoErrorOferta
}

union ResultadoOferta = Oferta | ErrorOferta # nunca un 5xx crudo al cliente (CA-W01-05)

input SolicitudOfertaInput {
  consentimientoId: ID!
  # Obligatorio para un ASESOR. Un CLIENTE con documento en su cuenta no lo manda: el BFF lo toma de AUTH y valida que
  # coincida con el titular del consentimiento (v0.18, W03-34).
  documentoIdentidad: String = null
  # v0.38 (T20): como en `ConsentimientoInput`; deben ser los mismos del consentimiento. El CLIENTE con documento en
  # su cuenta tampoco los manda.
  tipoDocumento: String = null
  pais: String = null
  # v0.39 (T19): el `placeId` elegido en `autocompletarDireccion`. Con él, la dirección se normaliza con Places y una de
  # un país no soportado se rechaza; sin él, o si Places no responde, la dirección escrita se usa «sin verificar».
  placeId: String = null
  valorCredito: String!
  plazoMeses: Int!
  direccionInmueble: String!
}

# ---------- Contacto con asesor (CA-W01-07) ----------

enum CanalContacto {
  LLAMAR
  CHAT
  AGENDAR
}

type ConfirmacionContacto {
  canal: CanalContacto!
  resumen: String!
}

# ---------- Cobros (HU-W05) ----------

enum EstadoCobro {
  COBRANDO
  COBRADO
  RECHAZADO
  PENDIENTE
}

# Quién es el cliente de un cobro. El nombre es dato personal: solo lo ve el BACKOFFICE
# y puede venir vacío si AUTH no responde o el cliente no tiene nombre registrado.
type ClienteCobro {
  id: ID!
  nombre: String
}

type Cobro {
  id: ID!
  polizaId: ID!
  estado: EstadoCobro!
  monto: Monto!
  actualizadoEn: DateTime!
  motivo: String # por qué quedó pendiente o rechazado (p. ej. pasarela_no_disponible)
  intentos: Int # cuántas veces se intentó cobrar
  idTransaccion: String # referencia que devolvió la pasarela; null mientras no hay cobro hecho
  # Reintentos manuales que le quedan a un cobro RECHAZADO (máximo 3, prototipo W05-01).
  # En 0, `reintentarCobro` responde error: requiere otro medio de pago.
  reintentosRestantes: Int
  cliente: ClienteCobro # null en cobros creados sin clienteId
  origen: OrigenCobro # v0.18 (W05-A3): null en cobros anteriores
  medio: MedioPago # v0.18 (W05-A5): marca y tipo del medio tokenizado; null si el cobro no tiene uno guardado
}

enum OrigenCobro {
  INTERACTIVO # lo pagó el titular en la página de la pasarela (HU-W03)
  RECURRENTE # cobro programado con el token guardado
}

enum TipoMedioPago {
  CREDITO
  DEBITO
}

# Nunca el número ni los últimos dígitos de la tarjeta: solo la marca (p. ej. VISA) y el tipo.
type MedioPago {
  marca: String!
  tipo: TipoMedioPago!
}

input MontoInput {
  valor: String! # decimal como texto, nunca float
  moneda: String!
}

input CrearCobroInput {
  # Lo genera el cliente (un UUID por intento) y lo reenvía igual si repite la orden:
  # así un doble clic o un reintento no cobra dos veces.
  idIntentoCobro: ID!
  polizaId: ID!
  # El cliente (usuario CLIENTE de AUTH) a quien se le cobra. Mientras no exista el servicio de
  # pólizas, nada valida que la póliza sea de ese cliente.
  clienteId: ID = null
  monto: MontoInput!
  tokenMedioPago: String! # token del proveedor PCI-DSS; nunca datos de tarjeta
}

type ErrorCobro {
  mensaje: String!
}

union ResultadoCobro = Cobro | ErrorCobro

# ---------- Suscripción, firma y póliza (HU-W03) ----------
# Flujo: aceptarOferta -> documentoFirma -> firmarPropuesta -> (en segundo plano: decisión, cobro y emisión).
# El cliente consulta `propuesta` hasta ver EMITIDA. El precio nunca lo manda el cliente: POLICY lo lee de la oferta.

enum EstadoPropuesta {
  ACEPTADA # oferta aceptada, falta firmar
  EN_EMISION # firmada; se está decidiendo, cobrando y emitiendo
  EN_REVISION # la suscripción pasó a revisión manual
  PENDIENTE_PAGO # el primer cobro quedó pendiente; se emite sola cuando se cobre
  PAGO_RECHAZADO # el primer cobro fue rechazado; no hay póliza. No es final: si el cobro se recupera,
  # el back-office o la reconciliación la reabren y pasa a EMITIDA (el cliente no la reabre)
  NO_EMITIDA # la suscripción rechazó la propuesta
  EMITIDA # hay póliza (ver Propuesta.polizaId)
  # v0.18 (HU-W03, bloque 9):
  IDENTIDAD_VERIFICADA # el asesor digitó el código válido; falta «Emitir»
  EN_FIRMA # la suscripción aprobó: el titular puede firmar (por el enlace o en su sesión)
  FIRMADA # el titular firmó; falta pagar
  CANCELADA # el consentimiento venció o se revocó antes de emitir; el contacto se borró
}

# Los tres estados de la tabla «Mis pólizas» / «Pólizas emitidas» (W03-35). EMITIENDO agrupa ACEPTADA,
# IDENTIDAD_VERIFICADA, EN_FIRMA, FIRMADA, EN_EMISION, PENDIENTE_PAGO, PAGO_RECHAZADO y EN_REVISION; EMITIDA es
# EMITIDA; NO_EMITIDA agrupa NO_EMITIDA y CANCELADA. El detalle sigue en `Propuesta.mensajeEstado`.
enum EstadoVisible {
  EMITIENDO
  EMITIDA
  NO_EMITIDA
}

# OFERTA_PRELIMINAR (D-11): una oferta preliminar no se acepta, se recalcula. `ErrorAceptacion.puedeReintentar` es true
# y "reintentar" es volver a cotizar (`solicitarOferta`), no repetir `aceptarOferta` con la misma oferta.
enum MotivoErrorAceptacion {
  OFERTA_PRELIMINAR
  OFERTA_VENCIDA
  OFERTA_NO_ENCONTRADA
  CONSENTIMIENTO_NO_VIGENTE
}

enum MotivoErrorFirma {
  COBRO_NO_AUTORIZADO
  VERSION_DOCUMENTO_DESACTUALIZADA
  PROPUESTA_NO_FIRMABLE
  SERVICIO_FIRMA_NO_DISPONIBLE
  ENLACE_VENCIDO # v0.18: el enlace venció o se anuló; el asesor puede reenviarlo
  IMAGEN_INVALIDA # v0.18: la imagen no pasó la validación (tipo, tamaño, dimensiones o fondo); se puede subir otra
}

# Por qué una propuesta no avanza (CA-W03-06). Son categorías para el cliente: nunca el código interno de la
# decisión de suscripción ni el de la pasarela.
enum MotivoEstadoPropuesta {
  PAGO_FONDOS_INSUFICIENTES # PAGO_RECHAZADO: la pasarela rechazó el cobro por fondos insuficientes
  PAGO_RECHAZADO # PAGO_RECHAZADO: cualquier otro rechazo de la pasarela
  PAGO_EN_PROCESO # PENDIENTE_PAGO: el cobro aún no se confirma
  REVISION_MANUAL # EN_REVISION: un asesor revisa la solicitud
  NO_APROBADA # NO_EMITIDA: la suscripción no aprobó la solicitud
}

# Qué debe hacer el cliente. Para CONTACTAR_ASESOR, la mutación `contactarAsesor`.
enum AccionSugerida {
  ESPERAR # nada: la propuesta sigue su curso y se le avisa
  CONTACTAR_ASESOR
}

type Propuesta {
  id: ID!
  ofertaId: ID!
  estado: EstadoPropuesta!
  prima: Monto!
  cobertura: Monto!
  plazoMeses: Int!
  polizaId: ID # presente cuando el estado es EMITIDA
  actualizadoEn: DateTime!
  # Presentes en EN_REVISION, PENDIENTE_PAGO, PAGO_RECHAZADO y NO_EMITIDA; nulos en los demás estados.
  motivoEstado: MotivoEstadoPropuesta
  mensajeEstado: String # qué pasa y qué hacer, en el idioma del usuario
  accionSugerida: AccionSugerida
  # v0.18 (W03-35):
  estadoVisible: EstadoVisible
  creadaEn: DateTime
  poliza: Poliza # presente en EMITIDA
  # Datos personales: solo para el ASESOR que la aceptó y el BACKOFFICE; null para el CLIENTE.
  nombreTitular: String # el nombre que capturó el asesor, o el de AUTH si el titular tiene cuenta
  nombreAsesor: String # solo para el BACKOFFICE; null si la aceptó el propio CLIENTE
  # v0.22 (HU-W07): solo para el BACKOFFICE; el socio de distribución que la vendió por la API. Entonces
  # `nombreAsesor` es null.
  nombreSocio: String
  # v0.42: el producto vendido; en AUTO, el vehículo (con la placa enmascarada).
  producto: Producto!
  vehiculo: VehiculoAsegurado
}

type PaginaPropuestas {
  propuestas: [Propuesta!]! # de la más reciente a la más antigua
  total: Int! # cuántas hay con ese filtro, para «Mostrando N de M»
  pagina: Int!
  tamano: Int!
}

type ErrorAceptacion {
  mensaje: String!
  puedeReintentar: Boolean!
  motivo: MotivoErrorAceptacion
}

union ResultadoAceptacion = Propuesta | ErrorAceptacion

# Lo que el cliente lee antes de firmar (W03-02a y W03-02b): el monto sale de la cláusula de cobro.
type DocumentoFirma {
  propuestaId: ID!
  version: String! # se reenvía en FirmarPropuestaInput.versionDocumento
  resumen: String!
  montoMensual: Monto!
  meses: Int!
  formaCobro: String! # p. ej. "con la cuota de tu crédito"
}

input FirmarPropuestaInput {
  propuestaId: ID!
  autorizaCobro: Boolean! # debe ser true: la firma autoriza el cobro recurrente
  versionDocumento: String!
}

type FirmaRegistrada {
  propuestaId: ID!
  firmadaEn: DateTime!
  referencia: String! # referencia de la evidencia de no repudio
  estado: EstadoPropuesta!
}

type ErrorFirma {
  mensaje: String!
  puedeReintentar: Boolean!
  motivo: MotivoErrorFirma
}

union ResultadoFirma = FirmaRegistrada | ErrorFirma

enum EstadoPoliza {
  EMITIDA
}

type Poliza {
  id: ID!
  numero: String!
  estado: EstadoPoliza!
  vigenciaDesde: DateTime!
  vigenciaHasta: DateTime!
  prima: Monto!
  cobertura: Monto!
  documentoUrl: String! # ruta del BFF que entrega el PDF; solo el titular, su asesor o un BACKOFFICE
  # v0.21 (HU-W04): ramo del producto. v0.42: sale del producto («Vida grupo deudor…» o «Automóviles todo riesgo»).
  ramo: String!
  # v0.42
  producto: Producto!
  vehiculo: VehiculoAsegurado # solo AUTO
  coberturas: [CoberturaAuto!]! # solo AUTO; vacía en VIDA_DEUDOR
}

# ---------- Firma y pago con el asesor o en la sesión del CLIENTE (v0.18, HU-W03 bloque 9) ----------
# Flujo del ASESOR (W03-32): aceptarOferta(contacto) -> enviarCodigoVerificacion -> verificarCodigo ->
# emitirPropuesta (UNDER decide; si aprueba, envía el enlace de 30 min) -> el titular, SIN sesión, sigue en la
# página del enlace: firmaPorEnlace -> solicitarSubidaFirma (modos TRAZO e IMAGEN) -> firmarPorEnlace -> iniciarPago
# -> (página de la pasarela, fuera de Solventa) -> confirmarPago -> póliza EMITIDA en la misma respuesta.
# Flujo del CLIENTE registrado (W03-32 y W03-33): aceptarOferta -> emitirPropuesta («Firmar»: UNDER decide y la
# propuesta pasa a EN_FIRMA, sin código ni enlace) -> las mismas operaciones de la página del enlace, en su sesión.
#
# Autorización de las operaciones de la página del enlace (W03-33): **o** el token del enlace en la cabecera
# `X-Enlace-Firma` (viaja en el fragmento de la URL `/firma#t=…`, W03-23; con él se ignora `propuestaId`), **o** el
# token de sesión de un CLIENTE cuyo titular sea el de la propuesta, y entonces `propuestaId` es obligatorio. Una
# propuesta ajena responde igual que una inexistente.

input ContactoTitularInput {
  nombre: String! # 2 a 100 caracteres
  correo: String! # se guarda cifrado y en minúsculas
}

enum MotivoErrorCodigo {
  CODIGO_INVALIDO
  CODIGO_VENCIDO
  INTENTOS_AGOTADOS
  PROPUESTA_NO_VALIDA
}

type CodigoEnviado {
  propuestaId: ID!
  correoEnmascarado: String! # p. ej. c•••@correo.com; nunca el correo completo
  venceEn: DateTime! # 10 min (W03-20)
}

type ErrorCodigo {
  mensaje: String!
  puedeReintentar: Boolean!
  motivo: MotivoErrorCodigo
  intentosRestantes: Int
}

union ResultadoEnvioCodigo = CodigoEnviado | ErrorCodigo
union ResultadoVerificacion = Propuesta | ErrorCodigo

type EnlaceEnviado {
  propuesta: Propuesta!
  correoEnmascarado: String!
  venceEn: DateTime! # 30 min (W03-22); la URL nunca vuelve al asesor
}

type ErrorEmision {
  mensaje: String!
  puedeReintentar: Boolean!
}

# ASESOR: EnlaceEnviado si UNDER aprueba. CLIENTE: Propuesta en EN_FIRMA si aprueba. Para los dos, Propuesta en
# EN_REVISION o NO_EMITIDA (con mensajeEstado) si UNDER no aprueba.
union ResultadoEmision = EnlaceEnviado | Propuesta | ErrorEmision

enum ModoFirma {
  TRAZO # dibujada en el lienzo; llega como PNG por el almacenamiento
  IMAGEN # PNG o JPG cargado, por el almacenamiento
  NOMBRE # nombre estilizado: se guarda el texto y el PDF lo dibuja con una fuente
}

type EnlaceFirma {
  vigente: Boolean! # false si el enlace venció o se anuló (con sesión de CLIENTE, siempre true)
  venceEn: DateTime # null con sesión de CLIENTE
  propuesta: Propuesta!
  documento: DocumentoFirma # lo que se firma; presente mientras se puede firmar
  documentoUrl: String # ruta del BFF con el PDF del contrato a firmar
  firma: FirmaRegistrada # presente desde FIRMADA
  poliza: Poliza # presente en EMITIDA
}

input FirmarPorEnlaceInput {
  propuestaId: ID = null # obligatorio solo con sesión de CLIENTE
  versionDocumento: String!
  aceptaTerminos: Boolean! # debe ser true
  autorizaCobro: Boolean! # debe ser true: la firma autoriza el cobro recurrente
  modo: ModoFirma!
  # TRAZO e IMAGEN: el id del archivo `firma-imagen` que devolvió `solicitarSubidaFirma`, ya subido con el PUT.
  imagenArchivoId: ID = null
  nombreFirma: String = null # NOMBRE: el nombre que se estiliza (2 a 100 caracteres)
}

type SesionPago {
  sesionId: ID!
  urlPago: String! # página de la pasarela, fuera de Solventa (W03-28)
  venceEn: DateTime! # 10 min
}

enum MotivoErrorPago {
  PAGO_RECHAZADO
  FONDOS_INSUFICIENTES
  TARJETA_VENCIDA
  PASARELA_NO_DISPONIBLE # reintentar concilia antes de cobrar (W03-30)
  REQUIERE_OTRA_TARJETA # 3.er fallo seguido
  SESION_VENCIDA
  ENLACE_VENCIDO
}

type ErrorPago {
  mensaje: String!
  puedeReintentar: Boolean!
  motivo: MotivoErrorPago
  fallosSeguidos: Int
}

union ResultadoInicioPago = SesionPago | ErrorPago
union ResultadoPago = Poliza | ErrorPago

# ---------- Avisos en vivo (v0.18, W03-37) ----------
# `EventSource` no manda cabeceras: el front pide un ticket y abre `GET <url>?ticket=<ticket>` (servicio `avisos`,
# fuera del API Gateway). El ticket sirve una sola vez y vence a los 60 s; nunca va el JWT en la URL.
# Cada evento SSE trae `event: <tipo>` y `data` en JSON, sin datos personales:
#   propuesta -> {"propuestaId", "estado", "estadoVisible", "polizaId", "numero"} (polizaId y numero desde EMITIDA)
#   cobro     -> {"cobroId", "polizaId", "estado"} (lo usa W05-01, W05-A6)
# El CLIENTE recibe los de sus propuestas, el ASESOR los de las que aceptó y el BACKOFFICE todos.

type TicketAvisos {
  ticket: String!
  url: String! # URL del stream de `avisos`, sin el ticket
  venceEn: DateTime!
}

# ---------- Usuarios y sesión (HU-M02, CA-W01-11) ----------
# El token de `Sesion` viaja en la cabecera `Authorization: Bearer <token>` de las demás operaciones.

enum RolUsuario {
  CLIENTE
  ASESOR
  BACKOFFICE
}

enum EstadoUsuario {
  ACTIVO
  SUSPENDIDO
  # v0.20 (HU-M01): cuenta creada en el onboarding del móvil, aún sin identidad verificada (solo entra por la app, con
  # el scope `verificacion-pendiente`), o cuya verificación se rechazó sin más intentos.
  PENDIENTE_VERIFICACION
  RECHAZADA
}

type Usuario {
  id: ID!
  usuario: String! # alias de acceso: nunca un correo ni un documento
  rol: RolUsuario!
  estado: EstadoUsuario!
  creadoEn: DateTime!
  # Dato personal. Solo viene en `iniciarSesion` y `yo` (cada usuario ve el suyo); en `usuarios`,
  # `crearUsuario` y los demás cambios va en null. Nunca viaja dentro del JWT.
  nombre: String
  # Preferencias de la interfaz (KAN-209): idioma (ES | EN) y moneda por defecto. No son datos personales.
  idioma: String!
  moneda: String!
  # Solo dice si el usuario ya dejó un contacto (correo o teléfono) para el aviso de su póliza (HU-W03, bloque 8);
  # nunca cuál es: el contacto se escribe con `crearUsuario` o `actualizarContacto` y no vuelve por GraphQL.
  tieneContacto: Boolean!
  # v0.18 (W03-34): el documento del CLIENTE enmascarado (p. ej. 10••••5678; T24: longitud conservada, 2 iniciales y 4 finales), solo en `iniciarSesion` y `yo`; null si
  # no tiene documento o no es CLIENTE. El documento completo nunca vuelve por GraphQL.
  documentoEnmascarado: String
  # v0.24 (perfil común): el correo del propio usuario, solo en `iniciarSesion` y `yo` (cada quien ve el suyo); en
  # `usuarios`, `crearUsuario` y los demás cambios va en null, y null si no tiene (solo los CLIENTE guardan correo).
  # Nunca viaja dentro del JWT. El teléfono sigue sin volver por GraphQL.
  correo: String
  # v0.38 (T20): tipo del documento del CLIENTE (CC, CE, CURP...; nunca el número), null si no tiene documento.
  tipoDocumento: String
  # v0.38 (T20): país de la cuenta (uno de los siete); el CLIENTE lo trae de su documento y cualquiera lo cambia en
  # `actualizarPreferencias`. Null si nunca se fijó.
  pais: String
  # v0.45 (KAN-259): preferencia del propio cliente para el push (siempre viene; enciende por defecto).
  notificacionesPush: Boolean!
}

type Sesion {
  token: String!
  expiraEn: DateTime!
  usuario: Usuario!
  # v0.26 (T22): refresh opaco, solo en el canal `app` (el móvil lo guarda en almacenamiento seguro). En la web viaja en
  # la cookie `solventa_refresh` (httpOnly; Secure; SameSite=Strict) que pone el BFF y aquí viene null.
  refreshToken: String
  # v0.26 (T22): vencimiento del refresh, en ambos canales. Las duraciones salen de `contracts/sesion.json`.
  refreshExpiraEn: DateTime
}

type ErrorAutenticacion {
  mensaje: String!
  # v0.20 (HU-M01): null en credenciales incorrectas. VERIFICACION_PENDIENTE: la clave es correcta pero la identidad
  # aún no se verificó y el canal no es la app (la web no admite esas cuentas).
  # v0.29 (T17): CLAVE_DEBIL en `registrarCuenta` cuando la clave no cumple la regla; el mensaje dice qué falta.

  # v0.26 (T22): SESION_VENCIDA en `renovarSesion`: refresh inexistente, vencido, ya usado, revocado, de otro canal o de
  # una cuenta que ya no puede renovar; nunca dice cuál (mismo mensaje siempre).
  codigo: String
}

union ResultadoSesion = Sesion | ErrorAutenticacion

# v0.44 (KAN-26): lo que el teléfono firma con su llave (tras la biometría) para entrar sin escribir la clave.
type DesafioDispositivo {
  reto: String!
  venceEn: DateTime!
}

# v0.43 (KAN-26): la clave cambió y se cerraron todas las sesiones de la cuenta.
type RestablecimientoExitoso {
  ok: Boolean!
}

# `ErrorAutenticacion.codigo`: ENLACE_INVALIDO (no existe, venció o ya se usó; mismo mensaje siempre) o CLAVE_DEBIL
# (el mensaje dice qué falta; el enlace no se gasta).
union ResultadoRestablecimiento = RestablecimientoExitoso | ErrorAutenticacion

type ErrorUsuario {
  mensaje: String!
}

union ResultadoUsuario = Usuario | ErrorUsuario

# v0.45 (KAN-259): la instalación de la app que inicia sesión, para la sesión única por cliente (D3) y el push.
# Independiente del dispositivo de la llave de login sin clave (KAN-26).
enum PlataformaMovil {
  ANDROID
  IOS
}

input DispositivoPushInput {
  instalacionId: String!
  plataforma: PlataformaMovil!
}

input CredencialesInput {
  usuario: String!
  clave: String!
  # v0.29 (T17): rol del chip elegido en la web. Si no es el de la cuenta, la respuesta es la de una clave errada
  # («Usuario o clave incorrectos.»): no se revela qué rol tiene. Opcional: los clientes viejos no lo mandan.
  rol: RolUsuario = null
  # v0.45 (KAN-259): solo con sesión en la app; la app lo manda siempre que entra con usuario y clave. Al iniciar
  # sesión en un dispositivo nuevo se revocan las demás sesiones `app` del cliente y su dispositivo de push.
  dispositivo: DispositivoPushInput = null
}

input CrearUsuarioInput {
  usuario: String!
  clave: String!
  rol: RolUsuario!
  nombre: String = null # cualquier rol (2 a 100 caracteres); se guarda cifrado y `crearUsuario` no lo devuelve
  # Solo CLIENTE (HU-W03, bloque 8); se guardan cifrados y `crearUsuario` no los devuelve.
  correo: String = null # con forma de correo; se guarda en minúsculas
  telefono: String = null # 7 a 15 dígitos, con un + opcional al inicio
  # v0.18 (W03-27): obligatorio para un CLIENTE, junto con el correo. Se guarda cifrado y como titular (el mismo HMAC
  # del consentimiento): el BACKOFFICE da por verificada la identidad al crearlo.
  documentoIdentidad: String = null
  # v0.38 (T20): tipo del documento del CLIENTE (del catálogo del país) y país de la cuenta (cualquier rol).
  tipoDocumento: String = null
  pais: String = null
}

input PreferenciasInput {
  idioma: String! # ES | EN
  moneda: String! # COP | USD | EUR | MXN | BRL | CLP | PEN
  pais: String = null # v0.38 (T20): uno de los siete; si no llega, se conserva
}

# Al menos uno de los dos; lo que no llega se conserva (HU-W03, bloque 8).
input ContactoInput {
  correo: String = null
  telefono: String = null
}

# ---------- Operaciones ----------

# ---------- Archivos (KAN-250, servicio ALMACENAMIENTO) ----------
# Los bytes nunca pasan por el BFF: el cliente sube con un PUT directo a la URL firmada que
# devuelve `solicitarSubidaArchivo` (mandando `encabezados` tal cual) y luego confirma.
# Qué tipos existen, quién sube y quién lee lo dice `contracts/tipos-archivo.json`.

enum EstadoArchivo {
  PENDIENTE
  DISPONIBLE
  RECHAZADO
  ELIMINADO
}

type Archivo {
  id: ID!
  tipo: String!
  estado: EstadoArchivo!
  tipoContenido: String!
  tamanoBytes: Int
  # Por qué se rechazó (p. ej. CONTENIDO_NO_COINCIDE); solo con estado RECHAZADO.
  motivo: String
  creadoEn: DateTime!
}

type EncabezadoSubida {
  nombre: String!
  valor: String!
}

type SubidaArchivo {
  archivo: Archivo!
  url: String!
  metodo: String!
  encabezados: [EncabezadoSubida!]!
  venceEn: DateTime!
}

type DescargaArchivo {
  url: String!
  venceEn: DateTime!
}

# `codigo` es estable (TIPO_NO_ADMITIDO, TAMANO_NO_ADMITIDO, NO_AUTORIZADO, OBJETO_NO_SUBIDO,
# ARCHIVO_NO_ENCONTRADO, ARCHIVO_NO_DISPONIBLE, ...); `mensaje` es para mostrar.
type ErrorArchivo {
  codigo: String!
  mensaje: String!
}

union ResultadoSubidaArchivo = SubidaArchivo | ErrorArchivo
union ResultadoArchivo = Archivo | ErrorArchivo
union ResultadoDescargaArchivo = DescargaArchivo | ErrorArchivo

input SolicitudSubidaArchivoInput {
  tipo: String!
  tipoContenido: String!
  tamanoBytes: Int!
  # Un CLIENTE sube siempre a su nombre: se ignora y se usa el id del token.
  propietarioId: ID = null
  consentimientoId: ID = null
}

# ---------- Onboarding de identidad (HU-M01, v0.20) ----------
# Recorrido del móvil antes de tener cuenta: documento (anverso y reverso), selfie y video de prueba de vida, que
# verifica el proveedor de identidad detrás del ACL Worker. `iniciarOnboarding` es pública y devuelve un token de
# 30 min que la app manda en la cabecera `X-Onboarding-Token` en las demás operaciones del recorrido (no es una
# sesión de usuario). Las imágenes no pasan por el BFF: la app hace el PUT directo a la URL firmada.
# Orden: iniciarOnboarding -> registrarConsentimientoOnboarding -> solicitarSubidaOnboarding + PUT +
# confirmarSubidaOnboarding (x4) -> crearCuentaOnboarding -> enviarVerificacion -> onboarding / miVerificacion.
# La cuenta puede crearse antes o después de enviar; al cerrar la verificación AUTH la activa (con nombre y documento
# leídos del documento) o la rechaza si ya no quedan intentos. Luego la app llama `actualizarSesion`.

enum EstadoOnboarding {
  INICIADO
  EN_VERIFICACION
  VERIFICADA
  RECHAZADA
  EN_REVISION
}

# Un código, nunca un dato del documento.
enum MotivoOnboarding {
  ILEGIBLE
  SUPLANTACION
  ROSTRO_NO_COINCIDE
  MENOR_DE_EDAD
  DOCUMENTO_YA_REGISTRADO
  PROVEEDOR_NO_DISPONIBLE # EN_REVISION: el proveedor no respondió; se revisa sin que la persona repita nada
  IMAGEN_NO_DISPONIBLE # EN_REVISION
}

enum PasoOnboarding {
  ANVERSO
  REVERSO
  ROSTRO
  VIDEO
}

enum TipoDocumentoOnboarding {
  CC
  CE
}

type Onboarding {
  id: ID!
  estado: EstadoOnboarding!
  motivo: MotivoOnboarding
  intento: Int! # 1 a 3
  intentosRestantes: Int! # 0 con DOCUMENTO_YA_REGISTRADO
}

type InicioOnboarding {
  onboarding: Onboarding!
  token: String! # va en `X-Onboarding-Token`; solo se entrega aquí
  tokenVenceEn: DateTime!
}

type CuentaOnboarding {
  # Sesión con el único scope `verificacion-pendiente` hasta que la verificación cierre.
  sesion: Sesion!
  onboarding: Onboarding!
}

type CodigoOnboardingEnviado {
  correoEnmascarado: String!
  venceEn: DateTime!
}

# `codigo` es estable: TOKEN_INVALIDO, SIN_CONSENTIMIENTO, ESTADO_INVALIDO, PIEZAS_INCOMPLETAS, SIN_INTENTOS,
# SESION_CON_CUENTA, CORREO_YA_REGISTRADO, DATO_INVALIDO, JURISDICCION_NO_SOPORTADA, NO_DISPONIBLE (con reintento)
# ESPERA_REQUERIDA (v0.31: reenvío del código antes de 60 s; trae `segundosRestantes`),
# o un código del almacenamiento (TIPO_CONTENIDO_NO_ADMITIDO, TAMANO_NO_ADMITIDO, OBJETO_NO_SUBIDO, ...).
type ErrorOnboarding {
  codigo: String!
  mensaje: String!
  segundosRestantes: Int # solo con ESPERA_REQUERIDA
}

union ResultadoInicioOnboarding = InicioOnboarding | ErrorOnboarding
union ResultadoOnboarding = Onboarding | ErrorOnboarding
union ResultadoSubidaOnboarding = SubidaArchivo | ErrorOnboarding
union ResultadoCuentaOnboarding = CuentaOnboarding | ErrorOnboarding
union ResultadoCodigoOnboarding = CodigoOnboardingEnviado | ErrorOnboarding

input IniciarOnboardingInput {
  jurisdiccion: String! = "CO"
  tipoDocumento: TipoDocumentoOnboarding!
}

input CuentaOnboardingInput {
  correo: String! # con él inicia sesión; AUTH lo guarda cifrado
  clave: String!
}
# ---------- Siniestros (v0.21, HU-W04, servicio CLAIMS) ----------
# Mesa de siniestros del BACKOFFICE: todas las operaciones exigen token de BACKOFFICE. Reemplaza al dummy
# `siniestros.graphql` (mismos nombres, argumentos y campos). Derivar a perito deja el caso EN_REVISION: no hay
# estado DERIVADO. Un caso derivado todavía se puede aprobar o rechazar; uno resuelto ya no admite cambios.
enum EstadoSiniestro {
  PENDIENTE
  EN_REVISION
  APROBADO
  RECHAZADO
}

enum TipoEvidencia {
  FOTO
  DOCUMENTO
}

enum TipoResolucion {
  APROBACION
  RECHAZO
  DERIVACION
}

enum MotivoRechazo {
  EVIDENCIA_INSUFICIENTE
  FUERA_DE_COBERTURA
  POLIZA_NO_VIGENTE
  INCONSISTENCIA_EN_RELATO
  OTRO
}

type Asegurado {
  nombre: String!
  documento: String!
}

type Ubicacion {
  descripcion: String!
  ciudad: String!
  latitud: Float!
  longitud: Float!
}

type Evidencia {
  id: ID!
  tipo: TipoEvidencia!
  titulo: String!
  archivo: String!
  # URL firmada de lectura del almacenamiento (vence en minutos); vacía si el archivo no está disponible.
  url: String!
  registradaEn: DateTime!
  # La foto trae la ubicación donde se tomó (W04-14: saldrá del EXIF; hoy la fija la semilla).
  geoetiquetada: Boolean!
  nota: String
}

type Verificacion {
  descripcion: String!
  cumple: Boolean!
}

type Perito {
  id: ID!
  nombre: String!
  ciudad: String!
  red: String!
  registro: String!
  tiempoRespuestaDias: Int!
  # Solo en `peritos(siniestroId)`: fecha límite del informe si se le deriva hoy.
  vencimientoInforme: DateTime
}

type Resolucion {
  tipo: TipoResolucion!
  resueltaEn: DateTime!
  notificacion: String!
  motivo: MotivoRechazo
  comentario: String
  viaRecurso: String
  indemnizacion: Monto
  metodoTransferencia: String
  plazoDispersion: String
  perito: Perito
  instrucciones: String
  vencimientoInforme: DateTime
  # v0.23: true si la aprobó el sistema porque el plazo del dictamen venció sin gestión.
  automatica: Boolean!
}

type Siniestro {
  id: ID!
  radicado: String!
  estado: EstadoSiniestro!
  asegurado: Asegurado!
  poliza: Poliza!
  coberturaAplicada: String!
  entidadAcreedora: String!
  ocurridoEn: DateTime!
  notificadoEn: DateTime!
  ubicacion: Ubicacion!
  descripcion: String!
  sumaReclamada: Monto!
  venceDictamenEn: DateTime!
  evidencias: [Evidencia!]!
  verificaciones: [Verificacion!]!
  resolucion: Resolucion
  # v0.42: solo en pólizas de AUTO. Si es parcial o de responsabilidad civil, `aprobarSiniestro` exige `valorDano`.
  tipoSiniestroAuto: TipoSiniestroAuto
}

# Error de negocio en lenguaje del operador (caso ya resuelto, perito no disponible, texto de más de 500 caracteres,
# orden de pago no registrada). Solo trae `mensaje`: la web distingue la union por la forma.
type ErrorSiniestro {
  mensaje: String!
}

union ResultadoResolucion = Siniestro | ErrorSiniestro

# ---------- Reporte del cliente (v0.35, HU-M05, servicio CLAIMS) ----------
# El CLIENTE reporta desde el móvil y el caso llega PENDIENTE a la mesa de siniestros (W04-01). Orden:
# solicitarSubidaEvidenciaSiniestro + PUT + confirmarSubidaArchivo por cada foto -> reportarSiniestro.
# `idReporte` lo genera la app (UUID) y es el id del siniestro: las fotos quedan a nombre del caso y reenviar con el
# mismo id devuelve el mismo caso. El nombre y el documento del asegurado salen de AUTH, nunca de la app.

# Lo que ve el CLIENTE de un caso que reportó: sin datos del operador ni del perito.
# v0.37 (HU-M05): lo que el CLIENTE ve de la resolución de su caso. Sin datos del operador ni del perito: ni el
# comentario (texto libre del BACKOFFICE), ni el perito, ni sus instrucciones.
type ResolucionCliente {
  tipo: TipoResolucion! # APROBACION, RECHAZO o DERIVACION (en revisión con un perito)
  resueltaEn: DateTime!
  motivo: MotivoRechazo # solo RECHAZO
  viaRecurso: String # solo RECHAZO: cómo pedir que lo revisen
  indemnizacion: Monto # solo APROBACION
  plazoDispersion: String # solo APROBACION
}

type SiniestroReportado {
  id: ID!
  radicado: String!
  estado: EstadoSiniestro!
  polizaId: ID!
  ocurridoEn: DateTime!
  notificadoEn: DateTime!
  venceDictamenEn: DateTime!
  fotos: Int!
  # v0.37: null mientras el caso está PENDIENTE.
  resolucion: ResolucionCliente
  tipoSiniestroAuto: TipoSiniestroAuto # v0.42: solo en pólizas de AUTO
}

# El error trae el mensaje para el cliente (póliza ajena o fuera de vigencia, foto inválida, relato muy corto, sin
# identidad verificada o servicio caído con reintento).
union ResultadoReporteSiniestro = SiniestroReportado | ErrorSiniestro

# ---------- Indemnización y cobertura paramétrica (v0.48, KAN-259, HU-M04 Fase 5) ----------
# Lo que la app móvil mostrará en la Fase 6 (fuera de este contrato) al tocar el push de una indemnización
# paramétrica (vuelo o clima) ya liquidada automáticamente por CLAIMS (ver evento `evento.parametrico.recibido`).

enum TipoEventoParametrico {
  VUELO_RETRASO
  VUELO_CANCELADO
  # Las 3 variables de clima (precipitación, viento, temperatura) colapsan en un solo tipo por ahora.
  CLIMA
}

enum EstadoIndemnizacion {
  EN_PROCESO
  # PAYMENTS todavía no dispersa de verdad (toda orden queda PENDIENTE_DISPERSION): este valor no se produce hoy.
  PAGADA
}

type Indemnizacion {
  id: ID!
  tipo: TipoEventoParametrico!
  referenciaEvento: String! # el vuelo (AV9340) o la celda ("lat,lon": sin reverse-geocoding)
  detalleEvento: String! # cuánto superó el umbral: "+180min", "62 mm", "Cancelado"
  fechaEvento: DateTime!
  pagadoEn: DateTime!
  monto: Monto!
  estado: EstadoIndemnizacion!
  # Nunca un número de cuenta real (regla #6): PAYMENTS solo guarda un método genérico de transferencia.
  metodoTransferencia: String
  polizaAnterior: Boolean! # la cobertura ya no estaba vigente al momento del evento
}

type ResumenCobertura {
  producto: String!
  numeroPoliza: String!
  vigente: Boolean!
  vigenteHasta: DateTime!
  tope: Monto! # el monto fijo de la cobertura paramétrica: no hay un tope acumulado distinto hoy
  movimientos: [Indemnizacion!]!
}

input UbicacionReporteInput {
  descripcion: String!
  ciudad: String!
  latitud: Float!
  longitud: Float!
}

input FotoReporteInput {
  archivoId: ID!
  tomadaEn: DateTime!
  # Donde se tomó la foto (GPS del teléfono); null si el cliente no dio permiso: la foto queda sin geoetiqueta.
  latitud: Float = null
  longitud: Float = null
}

# v0.42: qué pasó, en una póliza de AUTO. Decide la cobertura y cómo se calcula la indemnización.
enum TipoSiniestroAuto {
  CHOQUE_PARCIAL # pérdida parcial por daños: el operador digita el valor del daño al aprobar
  PERDIDA_TOTAL_DANOS # valor asegurado menos deducible
  HURTO_TOTAL # valor asegurado menos deducible
  HURTO_PARCIAL # el operador digita el valor al aprobar
  RESPONSABILIDAD_CIVIL # daños a terceros: el operador digita el valor al aprobar
}

input ReporteSiniestroInput {
  idReporte: ID!
  polizaId: ID!
  # v0.42: obligatorio si la póliza es de AUTO; se ignora en VIDA_DEUDOR.
  tipoSiniestroAuto: TipoSiniestroAuto = null
  ocurridoEn: DateTime!
  # De 10 a 1000 caracteres.
  descripcion: String!
  ubicacion: UbicacionReporteInput!
  # De 1 a 3 fotos `siniestro-foto`, ya confirmadas.
  fotos: [FotoReporteInput!]!
}

# ---------- Estado del sistema (v0.22, HU-W07) ----------
# Solo BACKOFFICE. Los pesos, los objetivos de latencia y los umbrales viven en contracts/salud.json. El socio ve una
# versión sin micros internos en `GET /v1/estado` (contracts/openapi/socios-v1.json).

enum ColorSalud {
  VERDE # >= 90
  AMARILLO # >= 70
  ROJO
}

enum EstadoCircuito {
  CERRADO
  SEMIABIERTO
  ABIERTO
  DESCONOCIDO # el ACL no respondió
}

type SaludMicro {
  nombre: String!
  peso: Int!
  porcentaje: Int! # 0 si /health no responde
  color: ColorSalud!
  responde: Boolean!
  sinTrafico: Boolean! # sin peticiones en la ventana (p. ej. escalado a cero)
  disponibilidad: Float # % de peticiones sin 5xx; null sin tráfico o sin métricas
  latenciaMediaMs: Int
  latenciaP95Ms: Int
}

type SaludExterna {
  nombre: String! # el circuito del ACL: open-finance, open-data, firma, kyc, pasarela, notificaciones
  estado: EstadoCircuito!
}

type SaludApi {
  nombre: String! # COTIZACION o EMISION
  porcentaje: Int!
  color: ColorSalud! # ROJO si alguno de sus micros no responde
  micros: [String!]!
  externas: [SaludExterna!]!
}

type EstadoSistema {
  porcentaje: Int! # promedio ponderado de los micros
  color: ColorSalud! # no es VERDE si alguna API está en ROJO
  disponibilidad: Float # del gateway (lo que vive el usuario); null sin métricas
  latenciaMediaMs: Int
  ventana: String! # 15m, 1h, 24h o 7d
  calculadoEn: DateTime!
  apis: [SaludApi!]!
  micros: [SaludMicro!]!
}

# v0.34: los errores de sesión llevan extensions.code = SIN_SESION o SESION_INVALIDA (no comparar el mensaje).
# v0.25 (T18): límites y datos de cada país soportado, leídos de contracts/jurisdicciones.json. La web y el
# móvil los usan para validar (plazo mínimo y máximo) sin llevarlos escritos.
type Jurisdiccion {
  codigo: String!
  nombre: String!
  moneda: String!
  tipoDocumento: String!
  plazoMin: Int!
  plazoMax: Int!
  # v0.33 (T20): tipos de documento del país (el nacional y el pasaporte; en Colombia, CC, CE y pasaporte).
  tiposDocumento: [TipoDocumentoPais!]!
}

# v0.33 (T20). Los códigos (CC, CPF...) no se traducen; las etiquetas sí.
type TipoDocumentoPais {
  codigo: String!
  etiquetaEs: String!
  etiquetaEn: String!
}

# v0.32 (T19)
type SugerenciaDireccion {
  placeId: String!
  descripcion: String!
}

# v0.32 (T19). verificado = false: Google no respondió, el lugar no es válido o el país no está soportado;
# la dirección escrita se permite «sin verificar» y no bloquea la cotización.
type DireccionValidada {
  verificado: Boolean!
  direccion: String
  ciudad: String
  pais: String
}

# v0.36 (HU-M06, KAN-263). Catálogo maestro de prestadores para la asistencia en sitio. Sin datos personales: la app
# guarda una copia, calcula la cercanía con la ubicación del teléfono (que no viaja) y solo descarga si cambia la versión.
# La app descarta los tipos que no conoce, así que agregar uno no la rompe.
enum TipoPrestador {
  MEDICO
  MECANICO
  GRUA # v0.49
}

type Prestador {
  id: ID!
  nombre: String!
  tipo: TipoPrestador!
  ciudad: String!
  latitud: Float! # WGS84
  longitud: Float!
  activo: Boolean! # false = dado de baja; la app lo descarta
  # v0.49 (detalle del prestador en la app, HU-M06): el color del pin dice si es aliado Solventa.
  aliado: Boolean!
  especialidad: String! # «Urgencias», «Grúa liviana»; vacío si el catálogo aún no la tiene
  direccion: String! # de la sede; vacía si el catálogo aún no la tiene
  horario: String # «Abierto 24 h»; null si no se publica
  fotoUrl: String # foto de la sede; null = la app muestra el placeholder del tipo
}

# v0.51 (HU-M06, B8): tiempo y ruta de un prestador hasta el cliente, por el ACL (Mapbox Matrix y Directions; simulado
# en local). Para pintar en la app las rutas tipo semáforo. Cada consulta queda en `auditoria_rutas` (CLAIMS) con la
# ubicación y la dirección aproximada cifradas, 90 días.
type RutaPrestador {
  prestadorId: ID!
  distanciaMetros: Int!
  duracionSegundos: Int!
  geometria: String # polyline6, del prestador al cliente; solo los 3 primeros de prestadorIds
  estimado: Boolean! # true = simulado (línea recta), no tráfico real
}

type CatalogoPrestadores {
  version: String! # versión vigente en el backend (AAAA-MM-DD.n)
  vigente: Boolean! # true si versionLocal ya es la vigente: entonces prestadores viene vacía
  prestadores: [Prestador!]! # completa (activos e inactivos) cuando vigente = false
}

# v0.40 (HU-M06, KAN-265 y KAN-266). Solicitar y cancelar la asistencia en sitio. Transaccional: lo escribe CLAIMS en
# la primaria. Aquí sí viaja la ubicación del cliente (adónde debe llegar el prestador): CLAIMS la guarda cifrada y
# nunca va a logs ni vuelve en la respuesta. Mientras no haya prestadores reales el desenlace es simulado: el primer
# intento queda NO_CONFIRMADA y el reintento con el mismo `idSolicitud` se confirma (M06-04b y M06-04a).
enum EstadoAsistencia {
  CONFIRMADA # el prestador va en camino (`minutosEstimados`)
  NO_CONFIRMADA # no se pudo confirmar (`motivo`); reenviar con el mismo idSolicitud reintenta
  CANCELADA
  LLEGO # v0.52: CONFIRMADA cuya llegadaEstimada ya pasó; se deriva al leer (misAsistencias, asistencia)
}

enum MotivoNoConfirmada {
  PRESTADOR_SIN_RESPUESTA
}

enum CodigoErrorAsistencia {
  PRESTADOR_NO_DISPONIBLE # dado de baja o inexistente: elegir otro desde el mapa
  TIPO_NO_ATENDIDO # el prestador no atiende ese tipo de asistencia
  DATOS_INVALIDOS # idSolicitud mal formado o de otra persona, o textos demasiado largos
  NO_ENCONTRADA # cancelar una asistencia que no existe o no es del cliente
}

input SolicitudAsistenciaInput {
  idSolicitud: ID! # UUID generado por la app: es el id de la asistencia y su clave de idempotencia
  prestadorId: ID!
  tipoAsistencia: TipoPrestador!
  descripcion: String = null # opcional, hasta 500 caracteres
  direccion: String = null # la que el cliente confirmó o corrigió, hasta 200 caracteres; obligatoria con DIRECCION
  latitud: Float! # WGS84, del GPS del teléfono o de la dirección ubicada (`ubicarDireccion`)
  longitud: Float!
  # v0.50 (HU-M06, B4): de dónde salió la ubicación. Se guarda con la asistencia y en la auditoría.
  origenUbicacion: OrigenUbicacion! = GPS
}

# v0.50 (HU-M06, B4 y B9): sin permiso de ubicación o con el GPS apagado, el cliente escribe su dirección; la app la
# convierte en coordenadas con `ubicarDireccion` y el mapa funciona igual que con GPS.
enum OrigenUbicacion {
  GPS
  DIRECCION
}

# El backend no devuelve textos para mostrar: la app pone el mensaje en el idioma del usuario.
enum CodigoUbicacion {
  DIRECCION_NO_ENCONTRADA # ni Places ni Geocoding la encontraron (o no es de Colombia)
  SERVICIO_NO_DISPONIBLE # Google no respondió o el circuito del ACL está abierto: reintentar
}

type UbicacionDireccion {
  encontrada: Boolean!
  latitud: Float # WGS84; solo si encontrada
  longitud: Float
  direccion: String # normalizada por Google, en el idioma de la app (`Accept-Language`)
  codigo: CodigoUbicacion # solo si no encontrada
}

# v0.41 (CA-M06-02): sin permiso de ubicación o con el GPS apagado, el cliente escribe adónde debe llegar el prestador.
input SolicitudAsistenciaDireccionInput {
  idSolicitud: ID! # UUID generado por la app: es el id de la asistencia y su clave de idempotencia
  prestadorId: ID!
  tipoAsistencia: TipoPrestador!
  direccion: String! # obligatoria, hasta 200 caracteres
  descripcion: String = null # opcional, hasta 500 caracteres
}

type Asistencia {
  id: ID!
  estado: EstadoAsistencia!
  tipoAsistencia: TipoPrestador!
  prestador: Prestador!
  minutosEstimados: Int # solo CONFIRMADA con ubicación (mismas reglas que la app: 20 km/h + 2 min); null si se pidió con la dirección a mano
  motivo: MotivoNoConfirmada # solo NO_CONFIRMADA
  solicitadaEn: DateTime!
  canceladaEn: DateTime
  # v0.52 (HU-M06, B5): para la cuenta regresiva de «Mis asistencias» y la notificación de llegada.
  confirmadaEn: DateTime # solo CONFIRMADA o LLEGO
  llegadaEstimada: DateTime # confirmadaEn + minutosEstimados; null sin tiempo estimado
  # v0.52 (B6): solo en misAsistencias y asistencia(id), y solo al cliente dueño: lo que pidió y adónde.
  descripcion: String
  ubicacion: UbicacionAsistencia
}

type UbicacionAsistencia {
  latitud: Float
  longitud: Float
  direccion: String
  origen: OrigenUbicacion!
}

type ErrorAsistencia {
  codigo: CodigoErrorAsistencia!
  mensaje: String!
}

union ResultadoAsistencia = Asistencia | ErrorAsistencia

type Query {
  # v0.32 (T19). Places detrás del ACL Worker (timeout 700 ms; sin llave, un stub). Lista vacía si no responde.
  autocompletarDireccion(texto: String!, pais: String = null): [SugerenciaDireccion!]!
  validarDireccion(placeId: String!): DireccionValidada!
  # v0.33 (T20). Pública. True si el tipo existe en el país y el número cumple su formato.
  documentoValido(pais: String!, tipoDocumento: String!, numero: String!): Boolean!
  # v0.25 (T18). Pública: son parámetros del producto, sin datos personales.
  jurisdicciones: [Jurisdiccion!]!
  # El archivo si existe y quien pregunta puede leerlo; si no, null.
  archivo(id: ID!): Archivo
  oferta(id: ID!): Oferta
  # v0.45 (Q-08). Solo ASESOR y solo las suyas; los demás roles reciben el error de sin permiso. `consultaFuentes` de
  # una ajena o inexistente devuelve null.
  consultasFuentes(pagina: Int = 1, tamano: Int = 10): PaginaConsultasFuentes!
  consultaFuentes(id: ID!): ConsultaFuentes
  cobros(polizaId: ID, estado: EstadoCobro, pagina: Int = 1, tamano: Int = 10): [Cobro!]!
  # v0.43 (KAN-26): ¿sirve el enlace de la cabecera `X-Enlace-Clave`? Público; solo dice sí o no.
  enlaceRestablecimientoVigente: Boolean!
  yo: Usuario
  usuarios(rol: RolUsuario): [Usuario!]!
  # Solo para mostrar: los montos en otra moneda con las tasas del ACL Worker (hasta 50 por llamada).
  convertirMontos(montos: [MontoInput!]!, moneda: String!): [Monto!]!
  propuesta(id: ID!): Propuesta
  documentoFirma(propuestaId: ID!): DocumentoFirma
  poliza(id: ID!): Poliza
  # v0.18 (W03-35). Filtradas por el rol del token, nunca por un argumento: CLIENTE, las de su titular (sin importar
  # quién las vendió); ASESOR, las que él aceptó; BACKOFFICE, todas. `estado` null = todas.
  propuestas(estado: EstadoVisible, pagina: Int = 1, tamano: Int = 10): PaginaPropuestas!
  # v0.18: página del enlace o sesión de CLIENTE (ver «Autorización» arriba). null si no existe o no es suya.
  firmaPorEnlace(propuestaId: ID = null): EnlaceFirma
  # ---------- v0.20 (HU-M01) ----------
  # Con `X-Onboarding-Token`. Lee el estado guardado: responde aunque el proveedor esté caído. null si el token no es
  # de ese recorrido.
  onboarding(id: ID!): Onboarding
  # Con sesión de CLIENTE (también la del scope `verificacion-pendiente`): el recorrido más reciente de su cuenta.
  miVerificacion: Onboarding
  # ---------- v0.21 (HU-W04) ----------
  # Mesa de siniestros, solo BACKOFFICE. `estado` null = todos, del más reciente al más antiguo.
  siniestros(estado: EstadoSiniestro = null): [Siniestro!]!
  siniestro(id: ID!): Siniestro
  # Peritos disponibles para derivar este caso, cada uno con su fecha límite de informe si se le deriva hoy.
  peritos(siniestroId: ID!): [Perito!]!
  # v0.35 (HU-M05): los casos que reportó el CLIENTE del token, del más reciente al más antiguo.
  misSiniestros: [SiniestroReportado!]!
  # ---------- v0.22 (HU-W07) ----------
  # Solo BACKOFFICE. `ventana`: 15m, 1h, 24h o 7d.
  estadoSistema(ventana: String = "1h"): EstadoSistema!
  # ---------- v0.36 (HU-M06) ----------
  # Sesión de CLIENTE (SIN_SESION si no hay). versionLocal null o distinta de la vigente: la lista completa.
  catalogoPrestadores(versionLocal: String = null): CatalogoPrestadores!
  # ---------- v0.48 (KAN-259, HU-M04 Fase 5) ----------
  # Sesión de CLIENTE: el detalle de una indemnización paramétrica. null si no existe, no es paramétrica o la
  # póliza no es del cliente del token (nunca filtra el expediente de otro cliente).
  indemnizacion(id: ID!): Indemnizacion
  # Sesión de CLIENTE: su cobertura paramétrica vigente, con las indemnizaciones ya liquidadas. null si no tiene
  # ninguna póliza paramétrica.
  miCoberturaParametrica: ResumenCobertura
  # v0.50 (HU-M06, B9): coordenadas de la dirección escrita, por el ACL (Place Details con `placeId` de
  # `autocompletarDireccion`, o Geocoding con `texto`; solo Colombia). Solo CLIENTE. La dirección no se registra.
  ubicarDireccion(placeId: String = null, texto: String = null): UbicacionDireccion!
  # v0.51 (HU-M06, B8): solo CLIENTE; hasta 10 prestadores, los destacados primero. Si el proveedor falla, lista vacía
  # (la app usa tiempos aproximados): nunca un error.
  rutasPrestadores(latitud: Float!, longitud: Float!, prestadorIds: [ID!]!): [RutaPrestador!]!
  # v0.52 (HU-M06, B6): las asistencias del CLIENTE de los últimos 30 días, más recientes primero (máximo 50).
  misAsistencias: [Asistencia!]!
  # v0.52 (B6): una asistencia del CLIENTE (al tocar la notificación de llegada). Ajena o inexistente: NO_ENCONTRADA.
  asistencia(id: ID!): ResultadoAsistencia!
}

type Mutation {
  registrarConsentimiento(entrada: ConsentimientoInput!): Consentimiento!
  revocarConsentimiento(id: ID!): Consentimiento!
  solicitarOferta(entrada: SolicitudOfertaInput!): ResultadoOferta!
  # v0.42: la oferta de la póliza de auto. Mismas reglas de consentimiento y degradación que `solicitarOferta`.
  solicitarOfertaAuto(entrada: SolicitudOfertaAutoInput!): ResultadoOferta!
  contactarAsesor(ofertaId: ID!, canal: CanalContacto!): ConfirmacionContacto!
  # PENDIENTE: concilia y cobra con la misma clave. RECHAZADO: un intento nuevo ante la pasarela,
  # hasta 3 veces. COBRADO o COBRANDO: lo devuelve sin cambios.
  reintentarCobro(cobroId: ID!): Cobro!
  crearCobro(entrada: CrearCobroInput!): ResultadoCobro!
  iniciarSesion(entrada: CredencialesInput!): ResultadoSesion!
  crearUsuario(entrada: CrearUsuarioInput!): ResultadoUsuario!
  cambiarRolUsuario(id: ID!, rol: RolUsuario!): ResultadoUsuario!
  suspenderUsuario(id: ID!): ResultadoUsuario!
  # Idioma y moneda por defecto del propio usuario (el id sale del token).
  actualizarPreferencias(entrada: PreferenciasInput!): ResultadoUsuario!
  # Correo y teléfono del propio CLIENTE (el id sale del token): a ese contacto se le envía el PDF de su póliza.
  # Se guardan cifrados y no se devuelven; el usuario responde `tieneContacto`.
  actualizarContacto(entrada: ContactoInput!): ResultadoUsuario!
  # Solo una oferta COMPLETA y vigente. Aceptar dos veces la misma oferta devuelve la misma propuesta.
  # v0.18 (W03-25): el ASESOR manda el contacto del titular (obligatorio para él); un CLIENTE no lo manda.
  aceptarOferta(ofertaId: ID!, contacto: ContactoTitularInput = null): ResultadoAceptacion!
  # Solo el CLIENTE titular firma (no repudio). Firmar dos veces devuelve la misma evidencia.
  firmarPropuesta(entrada: FirmarPropuestaInput!): ResultadoFirma!
  # KAN-250: URL firmada para subir un archivo directo al almacén (exige token).
  solicitarSubidaArchivo(entrada: SolicitudSubidaArchivoInput!): ResultadoSubidaArchivo!
  # Tras el PUT: valida el objeto (tamaño y firma del contenido). Idempotente.
  confirmarSubidaArchivo(id: ID!): ResultadoArchivo!
  # URL firmada de corta vida para leer un archivo DISPONIBLE; cada una queda auditada.
  descargarArchivo(id: ID!): ResultadoDescargaArchivo!
  # ---------- v0.18 (HU-W03, bloque 9) ----------
  # Solo ASESOR. Envía un código de 6 dígitos al correo del titular; `correo` corrige el que se capturó.
  # Pedir otro anula el anterior.
  enviarCodigoVerificacion(propuestaId: ID!, correo: String = null): ResultadoEnvioCodigo!
  # Solo ASESOR: el código que le dicta el titular. Vence a los 10 min y admite 5 intentos.
  verificarCodigo(propuestaId: ID!, codigo: String!): ResultadoVerificacion!
  # ASESOR («Emitir», con la identidad verificada) o CLIENTE titular («Firmar»): UNDER y KYC deciden aquí.
  emitirPropuesta(propuestaId: ID!): ResultadoEmision!
  # Solo ASESOR: un enlace nuevo de 30 min que anula el anterior; el titular retoma donde iba.
  reenviarEnlaceFirma(propuestaId: ID!): ResultadoEmision!
  # Página del enlace o sesión de CLIENTE. URL firmada para subir la imagen de la firma (tipo `firma-imagen`, PNG o
  # JPG, hasta 512000 bytes) con un PUT directo al almacén; luego `firmarPorEnlace` con el id del archivo.
  solicitarSubidaFirma(
    tipoContenido: String!
    tamanoBytes: Int!
    propuestaId: ID = null
  ): ResultadoSubidaArchivo!
  # Página del enlace o sesión de CLIENTE. Firma siempre el titular (W03-8). Firmar dos veces devuelve la misma firma.
  firmarPorEnlace(entrada: FirmarPorEnlaceInput!): ResultadoFirma!
  # Página del enlace o sesión de CLIENTE, con la propuesta FIRMADA: abre (o reabre) la sesión de pago.
  iniciarPago(propuestaId: ID = null): ResultadoInicioPago!
  # Al regresar de la pasarela: Solventa confirma el pago con la pasarela de servidor a servidor y, si se cobró, emite
  # la póliza en la misma respuesta (W03-29). Repetirlo no cobra dos veces.
  confirmarPago(sesionId: ID!, propuestaId: ID = null): ResultadoPago!
  # Ticket de un solo uso (60 s) para abrir el stream de avisos. Exige sesión de cualquier rol.
  ticketAvisos: TicketAvisos!
  # ---------- v0.20 (HU-M01): onboarding del móvil, ver la sección arriba ----------
  # Pública. Crea el recorrido y su token.
  iniciarOnboarding(entrada: IniciarOnboardingInput!): ResultadoInicioOnboarding!
  # Con `X-Onboarding-Token`. Registra en AUTH el consentimiento `onboarding-biometrico` (append-only) antes de
  # cualquier captura (regla 7).
  registrarConsentimientoOnboarding(onboardingId: ID!, versionTexto: String!): ResultadoOnboarding!
  # Con `X-Onboarding-Token`. URL firmada para una pieza (documento y selfie en JPG o PNG; video en MP4).
  solicitarSubidaOnboarding(
    onboardingId: ID!
    paso: PasoOnboarding!
    tipoContenido: String!
    tamanoBytes: Int!
  ): ResultadoSubidaOnboarding!
  # Con `X-Onboarding-Token`, tras el PUT. Idempotente.
  confirmarSubidaOnboarding(onboardingId: ID!, archivoId: ID!): ResultadoOnboarding!
  # v0.44 (KAN-26): con sesión de la app, guarda la llave pública del teléfono (EC P-256, SPKI en base64; la privada
  # nunca sale del Keystore/Keychain y exige biometría). Un solo dispositivo por cuenta: registrar otro revoca el anterior.
  # Cambiar la clave los revoca todos. Devuelve el id del dispositivo.
  registrarDispositivo(clavePublica: String!): String!
  # v0.44: pública. Entrega un reto de 60 s (exista o no el dispositivo, para no revelar cuáles existen).
  desafioDispositivo(dispositivoId: ID!): DesafioDispositivo!
  # v0.44: pública, solo canal app. Entra con la firma del reto (ECDSA SHA-256, DER en base64). Cualquier fallo responde
  # ErrorAutenticacion con codigo DISPOSITIVO_NO_VALIDO; la app pide entonces correo y contraseña.
  # v0.45 (KAN-259): `dispositivo` aplica la misma sesión única por cliente (D3) que con usuario y clave.
  iniciarSesionConDispositivo(
    dispositivoId: ID!
    reto: String!
    firma: String!
    dispositivo: DispositivoPushInput = null
  ): ResultadoSesion!
  # v0.43 (KAN-26): «olvidé mi contraseña». Responde `true` siempre, exista o no la cuenta (o se tope el límite de 3 por
  # correo y 10 por IP por hora): nunca revela quién está registrado. Si hay cuenta activa envía un enlace que vence a los
  # 30 minutos, sirve una vez y reemplaza al anterior.
  solicitarRestablecimientoClave(correo: String!): Boolean!
  # v0.43 (KAN-26): fija la clave nueva con el token de la cabecera `X-Enlace-Clave`. Cierra todas las sesiones de la cuenta.
  restablecerClave(clave: String!): ResultadoRestablecimiento!
  # Envía un código de 6 dígitos al correo para verificarlo en el onboarding (10 min, hasta 5 intentos).
  # Si ya hay una cuenta con ese correo no envía nada y responde `ErrorOnboarding` con `CORREO_YA_REGISTRADO`.
  enviarCodigoOnboarding(correo: String!): ResultadoCodigoOnboarding!
  # Verifica el código de 6 dígitos enviado al correo en el onboarding.
  verificarCodigoOnboarding(correo: String!, codigo: String!): ResultadoCodigoOnboarding!
  # Crea la cuenta CLIENTE en PENDIENTE_VERIFICACION validando el código OTP del correo, y devuelve su sesión.
  registrarCuenta(correo: String!, clave: String!, codigo: String!): ResultadoSesion!
  # Con `X-Onboarding-Token`. Crea la cuenta CLIENTE en PENDIENTE_VERIFICACION, la liga al recorrido y abre su sesión.
  crearCuentaOnboarding(onboardingId: ID!, entrada: CuentaOnboardingInput!): ResultadoCuentaOnboarding!
  # Con `X-Onboarding-Token` y las cuatro piezas confirmadas: responde EN_VERIFICACION y el resultado llega después
  # (consultar `onboarding` o `miVerificacion`).
  enviarVerificacion(onboardingId: ID!): ResultadoOnboarding!
  # Con `X-Onboarding-Token`, tras un RECHAZADA con intentos: vuelve a INICIADO y pide las cuatro piezas de nuevo.
  reintentarOnboarding(onboardingId: ID!): ResultadoOnboarding!
  # Con sesión (cualquier rol o scope): un token nuevo con los permisos del estado actual de la cuenta y la misma
  # expiración. Tras VERIFICADA, el token deja de ser `verificacion-pendiente`.
  actualizarSesion: ResultadoSesion!
  # ---------- v0.26 (T22): sesión con acceso corto y refresh largo ----------
  # Pública (el refresh es la credencial). Cambia el refresh por un acceso y un refresh nuevos; el anterior queda
  # inválido y reusarlo revoca toda la cadena. Web: ignora el argumento y lee la cookie `solventa_refresh`; exige la
  # cabecera `X-Solventa-Csrf: 1` (y un `Origin` autorizado si el navegador lo manda). App: `refreshToken` va como
  # argumento. Cualquier fallo responde ErrorAutenticacion con codigo SESION_VENCIDA.
  renovarSesion(refreshToken: String = null): ResultadoSesion!
  # Revoca la cadena del refresh (y borra la cookie en la web, con la misma cabecera anti-CSRF). Idempotente.
  cerrarSesion(refreshToken: String = null): Boolean!
  # ---------- v0.45 (KAN-259): dispositivos de push ----------
  # Solo CLIENTE, en la app. Al obtener el token de FCM y en `onTokenRefresh`; solo lo acepta sobre el dispositivo
  # que la sesión actual (`iniciarSesion`/`iniciarSesionConDispositivo` con `dispositivo`) dejó activo.
  registrarTokenPush(instalacionId: String!, tokenFcm: String!): Boolean!
  # Solo CLIENTE. Enciende o apaga el push del propio cliente (el id sale del token).
  actualizarPreferenciaPush(habilitado: Boolean!): Boolean!
  # ---------- v0.21 (HU-W04): mesa de siniestros, solo BACKOFFICE ----------
  # Aprobar registra la orden de pago de la indemnización en PAYMENTS (sin
  # dispersión); si no se puede registrar, responde ErrorSiniestro y el caso sigue abierto.
  # v0.42: `valorDano` (decimal en la moneda de la póliza) es obligatorio en un siniestro de AUTO parcial o de
  # responsabilidad civil, con tope del valor asegurado; la indemnización es ese valor menos el deducible. En pérdida
  # total se ignora: es el valor asegurado menos el deducible.
  aprobarSiniestro(id: ID!, valorDano: String = null): ResultadoResolucion!
  rechazarSiniestro(id: ID!, motivo: MotivoRechazo!, comentario: String = null): ResultadoResolucion!
  derivarSiniestro(id: ID!, peritoId: ID!, instrucciones: String = null): ResultadoResolucion!
  # ---------- v0.35 (HU-M05): reporte del cliente, solo CLIENTE ----------
  # URL firmada para una foto del caso que va a reportar (tipo `siniestro-foto`, a nombre de `idReporte`).
  solicitarSubidaEvidenciaSiniestro(idReporte: ID!, tipoContenido: String!, tamanoBytes: Int!): ResultadoSubidaArchivo!
  reportarSiniestro(entrada: ReporteSiniestroInput!): ResultadoReporteSiniestro!
  # ---------- v0.40 (HU-M06): asistencia en sitio, solo CLIENTE ----------
  # Idempotente por `idSolicitud`: reenviar una CONFIRMADA o CANCELADA la devuelve sin cambios; una NO_CONFIRMADA
  # reintenta confirmarla. Sin sesión: SIN_SESION. CLAIMS caído: error público con reintento (nunca un 5xx).
  solicitarAsistencia(entrada: SolicitudAsistenciaInput!): ResultadoAsistencia!
  # v0.41 (HU-M06, CA-M06-02): lo mismo sin ubicación, con la dirección a mano. Sin dirección: DATOS_INVALIDOS.
  solicitarAsistenciaConDireccion(entrada: SolicitudAsistenciaDireccionInput!): ResultadoAsistencia!
    @deprecated(reason: "v0.50: usar solicitarAsistencia con las coordenadas de ubicarDireccion y origenUbicacion DIRECCION")
  # Idempotente: cancelar dos veces devuelve la misma asistencia CANCELADA.
  cancelarAsistencia(id: ID!): ResultadoAsistencia!
