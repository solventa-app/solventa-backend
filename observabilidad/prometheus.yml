global:
  scrape_interval: 5s

# Todos los servicios exponen /metrics (prometheus-fastapi-instrumentator).
scrape_configs:
  - job_name: servicios
    metrics_path: /metrics
    static_configs:
      - targets:
          - bff:8000
          - auth:8001
          - risk:8002
          - rating:8003
          - payments:8004
          - acl-worker:8005
        labels: { capa: negocio }
      - targets:
          - stub-open-finance:8101
          - stub-open-data:8102
          - stub-pasarela:8103
        labels: { capa: stub }
