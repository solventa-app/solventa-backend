# Entorno local del backend de Solventa.
#
#   docker compose up -d                                  # solo dependencias: Postgres, Redis, MongoDB (replica set)
#   docker compose --profile servicios up -d --build --wait   # + migraciones, servicios y stubs
#   docker compose --profile observabilidad up -d         # + Prometheus y Grafana
#
# Los puertos de host evitan chocar con los stacks de ../solventa-arquitectura (Mongo 27017/27018,
# Prometheus 9090, Grafana 3000): aquí Mongo usa 27117/27118, Prometheus 9190 y Grafana 3100.
# Si 5432 o 6379 ya están ocupados en tu máquina: `POSTGRES_PORT=5433 REDIS_PORT=6380 docker compose up -d`.
# Nota: el replica set anuncia los hosts `mongo1`/`mongo2`, que solo resuelven dentro de la red de
# compose; desde el host usa `mongosh` directo a un nodo (`directConnection=true`).

# Orden igual al de staging: migrar el esquema (tarea de un solo uso) -> arrancar el servicio.
# `migrar-*` usa la MISMA imagen que el servicio (en staging, un Cloud Run Job con la imagen a desplegar).
x-tarea: &tarea
  restart: "no"
  profiles: ["servicios"]
  pull_policy: build   # imágenes locales: siempre construir (evita servir una imagen vieja y el intento de descarga)

x-servicio: &servicio
  <<: *tarea
  healthcheck:
    # Cada imagen define PORT; el servicio queda "healthy" cuando /health responde.
    test: ["CMD", "python", "-c", "import os,urllib.request as u; u.urlopen(f'http://localhost:{os.environ[\"PORT\"]}/health', timeout=3)"]
    interval: 5s
    timeout: 5s
    retries: 10
    start_period: 5s

services:
  # ---------------------------------------------------------------- datos
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-solventa-local}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - ./dev/postgres:/docker-entrypoint-initdb.d:ro   # crea una base por servicio (auth, payments, policy, almacenamiento, onboarding)
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - "${REDIS_PORT:-6379}:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  # Emulador de Cloud Storage para el servicio `almacenamiento` (KAN-250). No revisa firmas ni rangos de tamaño y no
  # emite notificaciones: el servicio vuelve a medir todo al confirmar (ver services/almacenamiento/README.md).
  # `-public-host` es la dirección con la que el cliente (navegador, emulador móvil) llega a las URLs firmadas.
  fake-gcs:
    image: fsouza/fake-gcs-server:1.52.2
    command: ["-scheme", "http", "-port", "4443", "-public-host", "localhost:4443", "-external-url", "http://localhost:4443"]
    ports:
      - "${FAKE_GCS_PORT:-4443}:4443"

  mongo1:
    image: mongo:7.0
    command: ["mongod", "--replSet", "rs0", "--bind_ip_all", "--oplogSize", "256"]
    ports:
      - "27117:27017"
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 5s

  mongo2:
    image: mongo:7.0
    command: ["mongod", "--replSet", "rs0", "--bind_ip_all", "--oplogSize", "256"]
    ports:
      - "27118:27017"
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 5s

  # Contenedor de un solo uso: inicializa el replica set (idempotente) y sale.
  mongo-init:
    image: mongo:7.0
    restart: "no"
    volumes:
      - ./dev/mongo:/scripts:ro
    command: ["mongosh", "--host", "mongo1:27017", "--quiet", "/scripts/init-replica-set.js"]
    depends_on:
      mongo1:
        condition: service_healthy
      mongo2:
        condition: service_healthy

  # ------------------------------------------------------------ servicios
  gateway:
    image: envoyproxy/envoy:v1.31-latest
    restart: "no"
    profiles: ["servicios"]
    ports: ["8080:8080"]
    volumes:
      - ./infra/gateway/envoy.yaml:/etc/envoy/envoy.yaml:ro
    depends_on:
      bff: { condition: service_healthy }
    healthcheck:
      test:
        [
          "CMD",
          "/bin/bash",
          "-c",
          "exec 3<>/dev/tcp/127.0.0.1/8080 && printf 'GET /health HTTP/1.1\\r\\nHost: localhost\\r\\nConnection: close\\r\\n\\r\\n' >&3 && grep -q '200' <&3",
        ]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 5s

  bff:
    <<: *servicio
    build: ./services/bff
    ports: ["8000:8000"]
    environment:
      AUTH_URL: http://auth:8001
      ACL_URL: http://acl-worker:8005
      RISK_URL: http://risk:8002
      RATING_URL: http://rating:8003
      PAYMENTS_URL: http://payments:8004
      POLICY_URL: http://policy:8007
      ALMACENAMIENTO_URL: http://almacenamiento:8009
      ONBOARDING_URL: http://onboarding:8010
      # Solo local: el repo es público. En Cloud Run llega de Secret Manager (clave-cliente-id).
      CLIENTE_ID_CLAVE: solo-local-no-secreta
      # Mismo valor que AUTH (firma HS256). Solo local; en Cloud Run llega de Secret Manager (clave-jwt).
      JWT_SECRETO: solo-local-no-secreta-jwt-solventa-0001
      # "opcional": sin token las operaciones de antes siguen funcionando (ver docs/autenticacion-usuarios.md).
      AUTENTICACION_USUARIOS: opcional
    depends_on:
      auth: { condition: service_healthy }
      acl-worker: { condition: service_healthy }
      risk: { condition: service_healthy }
      rating: { condition: service_healthy }

  migrar-auth:
    <<: *tarea
    image: solventa/auth:local
    build: ./services/auth
    command: ["alembic", "upgrade", "head"]
    environment:
      DATABASE_URL: postgresql://postgres:${POSTGRES_PASSWORD:-solventa-local}@postgres:5432/auth
    depends_on:
      postgres: { condition: service_healthy }

  # Primer usuario BACKOFFICE (la API exige un BACKOFFICE para crear usuarios). Idempotente:
  # si ya existe no hace nada, así que corre en cada `up`. Alias y clave SOLO LOCALES, no secretos.
  crear-backoffice:
    <<: *tarea
    image: solventa/auth:local
    build: ./services/auth
    command: ["python", "-m", "app.crear_usuario", "--usuario", "admin.solventa", "--rol", "BACKOFFICE"]
    environment:
      DATABASE_URL: postgresql://postgres:${POSTGRES_PASSWORD:-solventa-local}@postgres:5432/auth
      CLAVE_INICIAL: admin-local-solventa
    depends_on:
      migrar-auth: { condition: service_completed_successfully }

  auth:
    <<: *servicio
    image: solventa/auth:local
    build: ./services/auth
    ports: ["8001:8001"]
    environment:
      DATABASE_URL: postgresql://postgres:${POSTGRES_PASSWORD:-solventa-local}@postgres:5432/auth
      # Solo local; en Cloud Run llega de Secret Manager (clave-jwt), el mismo que usa el BFF.
      JWT_SECRETO: solo-local-no-secreta-jwt-solventa-0001
      # Cifrado por campo del nombre del cliente. Sin valor, usa la llave local (no secreta);
      # en Cloud Run llega de Secret Manager (clave-cifrado) y no arranca con la local.
      CIFRADO_CLAVE: c29sby1sb2NhbC1ub19zZWNyZXRhLWNpZnJhZG8tMDE=
      # El mismo valor que el BFF: el titular del CLIENTE debe coincidir con el del consentimiento
      # (W03-27). Solo local; en Cloud Run llega de Secret Manager (clave-cliente-id).
      CLIENTE_ID_CLAVE: solo-local-no-secreta
    depends_on:
      postgres: { condition: service_healthy }
      migrar-auth: { condition: service_completed_successfully }
      crear-backoffice: { condition: service_completed_successfully }

  migrar-risk:
    <<: *tarea
    image: solventa/risk:local
    build: ./services/risk
    command: ["python", "-m", "migrations"]
    environment:
      MONGO_URI: mongodb://mongo1:27017,mongo2:27017/?replicaSet=rs0
      MONGO_DB: risk
      CIFRADO_CLAVE: c29sby1sb2NhbC1ub19zZWNyZXRhLWNpZnJhZG8tMDE=
    depends_on:
      mongo-init: { condition: service_completed_successfully }

  risk:
    <<: *servicio
    image: solventa/risk:local
    build: ./services/risk
    ports: ["8002:8002"]
    environment:
      MONGO_URI: mongodb://mongo1:27017,mongo2:27017/?replicaSet=rs0
      MONGO_DB: risk
      ACL_URL: http://acl-worker:8005
      REDIS_URL: redis://redis:6379/0
      CIFRADO_CLAVE: c29sby1sb2NhbC1ub19zZWNyZXRhLWNpZnJhZG8tMDE=
    depends_on:
      mongo-init: { condition: service_completed_successfully }
      migrar-risk: { condition: service_completed_successfully }
      redis: { condition: service_healthy }

  migrar-claims:
    <<: *tarea
    image: solventa/claims:local
    build: ./services/claims
    command: ["python", "-m", "migrations"]
    environment:
      MONGO_URI: mongodb://mongo1:27017,mongo2:27017/?replicaSet=rs0
      MONGO_DB: claims
    depends_on:
      mongo-init: { condition: service_completed_successfully }

  claims:
    <<: *servicio
    image: solventa/claims:local
    build: ./services/claims
    ports: ["8011:8011"]
    environment:
      MONGO_URI: mongodb://mongo1:27017,mongo2:27017/?replicaSet=rs0
      MONGO_DB: claims
      CIFRADO_CLAVE: c29sby1sb2NhbC1ub19zZWNyZXRhLWNpZnJhZG8tMDE=
      ALMACENAMIENTO_URL: http://almacenamiento:8009
      ALMACEN_REESCRITURA_ORIGENES: http://localhost:4443/=http://fake-gcs:4443/
      POLICY_URL: http://policy:8007
      PAYMENTS_URL: http://payments:8004
      # Solo local (W04-15): POST /_demo/reiniciar vuelve a la semilla para las E2E de la web.
      DEMO_REINICIAR: "true"
      SEMILLA_DIR: /semilla
    # Los datos de la semilla son los del dummy, que se conserva (W04-13): se montan, no se copian.
    volumes:
      - ./stubs/siniestros/app/datos:/semilla:ro
    depends_on:
      mongo-init: { condition: service_completed_successfully }
      migrar-claims: { condition: service_completed_successfully }

  # Semillas de la mesa de siniestros (HU-W04, W04-3), solo local: primero las pólizas en POLICY
  # (escritor único de sus tablas) y luego los siniestros, que apuntan a esas pólizas y suben sus
  # evidencias al almacenamiento. Idempotentes: `docker compose run --rm sembrar-siniestros`.
  sembrar-polizas-demo:
    <<: *tarea
    image: solventa/policy:local
    build: ./services/policy
    command: ["python", "-m", "app.sembrar_demo"]
    environment:
      DATABASE_URL: postgresql://postgres:${POSTGRES_PASSWORD:-solventa-local}@postgres:5432/policy
    depends_on:
      migrar-policy: { condition: service_completed_successfully }

  sembrar-siniestros:
    <<: *tarea
    image: solventa/claims:local
    build: ./services/claims
    command: ["python", "-m", "app.sembrar"]
    environment:
      MONGO_URI: mongodb://mongo1:27017,mongo2:27017/?replicaSet=rs0
      MONGO_DB: claims
      CIFRADO_CLAVE: c29sby1sb2NhbC1ub19zZWNyZXRhLWNpZnJhZG8tMDE=
      ALMACENAMIENTO_URL: http://almacenamiento:8009
      ALMACEN_REESCRITURA_ORIGENES: http://localhost:4443/=http://fake-gcs:4443/
      POLICY_URL: http://policy:8007
      SEMILLA_DIR: /semilla
    volumes:
      - ./stubs/siniestros/app/datos:/semilla:ro
    depends_on:
      migrar-claims: { condition: service_completed_successfully }
      sembrar-polizas-demo: { condition: service_completed_successfully }
      almacenamiento: { condition: service_healthy }
      policy: { condition: service_healthy }

  rating:
    <<: *servicio
    build: ./services/rating
    ports: ["8003:8003"]
    environment:
      MONGO_URI: mongodb://mongo1:27017,mongo2:27017/?replicaSet=rs0
      REDIS_URL: redis://redis:6379/0
      RATING_MAX_TIME_MS: "150"  # D-02: cota de espera de la sesion causal sobre la secundaria antes de caer a la primaria (EC011/EC012)
      CIFRADO_CLAVE: c29sby1sb2NhbC1ub19zZWNyZXRhLWNpZnJhZG8tMDE=
    depends_on:
      mongo-init: { condition: service_completed_successfully }
      redis: { condition: service_healthy }

  migrar-payments:
    <<: *tarea
    image: solventa/payments:local
    build: ./services/payments
    command: ["alembic", "upgrade", "head"]
    environment:
      DATABASE_URL: postgresql://postgres:${POSTGRES_PASSWORD:-solventa-local}@postgres:5432/payments
    depends_on:
      postgres: { condition: service_healthy }

  payments:
    <<: *servicio
    image: solventa/payments:local
    build: ./services/payments
    ports: ["8004:8004"]
    environment:
      DATABASE_URL: postgresql://postgres:${POSTGRES_PASSWORD:-solventa-local}@postgres:5432/payments
      ACL_URL: http://acl-worker:8005
    depends_on:
      postgres: { condition: service_healthy }
      migrar-payments: { condition: service_completed_successfully }

  migrar-policy:
    <<: *tarea
    image: solventa/policy:local
    build: ./services/policy
    command: ["alembic", "upgrade", "head"]
    environment:
      DATABASE_URL: postgresql://postgres:${POSTGRES_PASSWORD:-solventa-local}@postgres:5432/policy
    depends_on:
      postgres: { condition: service_healthy }

  policy:
    <<: *servicio
    image: solventa/policy:local
    build: ./services/policy
    ports: ["8007:8007"]
    environment:
      DATABASE_URL: postgresql://postgres:${POSTGRES_PASSWORD:-solventa-local}@postgres:5432/policy
      RATING_URL: http://rating:8003
      ACL_URL: http://acl-worker:8005
      UNDER_URL: http://under:8008
      PAYMENTS_URL: http://payments:8004
      # El contacto y el nombre del cliente para el aviso con PDF (bloque 8, W03-16).
      AUTH_URL: http://auth:8001
      # Bloque 9 (HU-W03): la imagen de la firma, los avisos en vivo y la página del enlace.
      ALMACENAMIENTO_URL: http://almacenamiento:8009
      ALMACEN_REESCRITURA_ORIGENES: http://localhost:4443/=http://fake-gcs:4443/
      REDIS_URL: redis://redis:6379/3
      URL_FRONT: http://localhost:5173
    depends_on:
      postgres: { condition: service_healthy }
      migrar-policy: { condition: service_completed_successfully }
      auth: { condition: service_healthy }
      almacenamiento: { condition: service_healthy }

  migrar-almacenamiento:
    <<: *tarea
    image: solventa/almacenamiento:local
    build: ./services/almacenamiento
    command: ["alembic", "upgrade", "head"]
    environment:
      DATABASE_URL: postgresql://postgres:${POSTGRES_PASSWORD:-solventa-local}@postgres:5432/almacenamiento
    depends_on:
      postgres: { condition: service_healthy }

  almacenamiento:
    <<: *servicio
    image: solventa/almacenamiento:local
    build: ./services/almacenamiento
    ports: ["8009:8009"]
    environment:
      DATABASE_URL: postgresql://postgres:${POSTGRES_PASSWORD:-solventa-local}@postgres:5432/almacenamiento
      # Local: firma con una llave de prueba contra el emulador (en Cloud Run: signBlob de IAM).
      FIRMANTE: local
      STORAGE_EMULATOR_HOST: http://fake-gcs:4443
      ALMACEN_BUCKET: solventa-archivos-local
      # Con el emulador de Android: http://10.0.2.2:4443 (y -public-host de fake-gcs igual).
      ALMACEN_URL_PUBLICA: http://localhost:${FAKE_GCS_PORT:-4443}
    depends_on:
      postgres: { condition: service_healthy }
      fake-gcs: { condition: service_started }
      migrar-almacenamiento: { condition: service_completed_successfully }

  migrar-onboarding:
    <<: *tarea
    image: solventa/onboarding:local
    build: ./services/onboarding
    command: ["alembic", "upgrade", "head"]
    environment:
      DATABASE_URL: postgresql://postgres:${POSTGRES_PASSWORD:-solventa-local}@postgres:5432/onboarding
    depends_on:
      postgres: { condition: service_healthy }

  # Recorrido de verificación de identidad de HU-M01. En local la verificación corre en un hilo (DISPARADOR=bucle).
  onboarding:
    <<: *servicio
    image: solventa/onboarding:local
    build: ./services/onboarding
    ports: ["8010:8010"]
    environment:
      DATABASE_URL: postgresql://postgres:${POSTGRES_PASSWORD:-solventa-local}@postgres:5432/onboarding
      ALMACENAMIENTO_URL: http://almacenamiento:8009
      ACL_URL: http://acl-worker:8005
      # Solo local: el repo es público. En Cloud Run llegan de Secret Manager (clave-cliente-id, clave-cifrado).
      CLIENTE_ID_CLAVE: solo-local-no-secreta
      CIFRADO_CLAVE: c29sby1sb2NhbC1ub19zZWNyZXRhLWNpZnJhZG8tMDE=
    depends_on:
      almacenamiento: { condition: service_healthy }
      acl-worker: { condition: service_healthy }
      migrar-onboarding: { condition: service_completed_successfully }

  under:
    <<: *servicio
    build: ./services/under
    ports: ["8008:8008"]
    environment:
      ACL_URL: http://acl-worker:8005

  acl-worker:
    <<: *servicio
    build: ./services/acl-worker
    ports: ["8005:8005"]
    environment:
      REDIS_URL: redis://redis:6379/1
      OPEN_FINANCE_URL: http://stub-open-finance:8101
      OPEN_DATA_URL: http://stub-open-data:8102
      PASARELA_URL: http://stub-pasarela:8103
      FIRMA_URL: http://stub-firma:8104
      KYC_URL: http://stub-kyc:8105   # también la verificación de identidad de M01 (rutas de Didit)
      # M01: las URLs firmadas del almacenamiento apuntan a localhost:4443; desde aquí es fake-gcs.
      IDENTIDAD_REESCRITURA_ORIGENES: http://localhost:4443/=http://fake-gcs:4443/
      NOTIFICACIONES_URL: http://stub-notificaciones:8106
      TIMEOUT_MS: "700"        # umbral duro de EC009/EC010
      BREAKER_UMBRAL_FALLOS: "3"       # fallos consecutivos que abren el circuito
      BREAKER_TTL_SEGUNDOS: "5"        # tiempo abierto antes de permitir la próxima sonda
      SONDA_INTERVALO_SEGUNDOS: "2"    # frecuencia de la sonda de recuperación (regla #5)
      CACHE_TTL_SEGUNDOS: "300"        # <= 5 min: cota superior de CA-W01-08
      COLA_RECONCILIACION_REDIS_URL: redis://redis:6379/2  # cola de reconciliación diferida (consolidador-fuentes)
    depends_on:
      redis: { condition: service_healthy }

  # Ampliación de alcance pedida por el usuario, fuera de `docs/sprint-1.md`
  # original (ver nota en ese archivo): consume la reconciliación diferida
  # encolada por acl-worker cuando una fuente degrada.
  consolidador-fuentes:
    <<: *servicio
    build: ./services/consolidador-fuentes
    ports: ["8006:8006"]
    environment:
      ACL_URL: http://acl-worker:8005
      # Antes de reintentar una fuente verifica que el consentimiento siga vigente (regla #7).
      AUTH_URL: http://auth:8001
      REDIS_URL: redis://redis:6379/2
    depends_on:
      redis: { condition: service_healthy }
      acl-worker: { condition: service_started }
      auth: { condition: service_healthy }

  stub-open-finance:
    <<: *servicio
    build: ./stubs/open-finance
    ports: ["8101:8101"]

  stub-open-data:
    <<: *servicio
    build: ./stubs/open-data
    ports: ["8102:8102"]

  stub-pasarela:
    <<: *servicio
    build: ./stubs/pasarela
    ports: ["8103:8103"]
    environment:
      # Página de pago alojada (W03-28): el navegador la abre en localhost:8103 y vuelve al front.
      PASARELA_URL_PUBLICA: http://localhost:8103
      URLS_RETORNO_PERMITIDAS: http://localhost:5173,http://localhost:8080

  stub-firma:
    <<: *servicio
    build: ./stubs/firma
    ports: ["8104:8104"]

  stub-kyc:
    <<: *servicio
    build: ./stubs/kyc
    ports: ["8105:8105"]

  stub-notificaciones:
    <<: *servicio
    build: ./stubs/notificaciones
    ports: ["8106:8106"]

  # Dummy de siniestros para el front de HU-W04 (KAN-27): sin BD ni tokens; solo local por ahora.
  stub-siniestros:
    <<: *servicio
    build: ./stubs/siniestros
    ports: ["8107:8107"]

  # -------------------------------------------------------- observabilidad
  prometheus:
    image: prom/prometheus:v2.55.1
    profiles: ["observabilidad"]
    volumes:
      - ./observabilidad/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    ports: ["9190:9090"]

  grafana:
    image: grafana/grafana:11.3.1
    profiles: ["observabilidad"]
    environment:
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Admin
    volumes:
      - ./observabilidad/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./observabilidad/grafana/dashboards:/var/lib/grafana/dashboards:ro
    ports: ["3100:3000"]
    depends_on: [prometheus]

  # Grafana que lee de Google Cloud (métricas, logs y trazas de staging) con tus credenciales de `gcloud`. No necesita
  # el resto del compose: `docker compose --profile gcp up -d grafana-gcp` y abre http://localhost:3200.
  # Antes, una vez: `gcloud auth application-default login`. En Windows apunta al archivo con
  # `$env:GCLOUD_ADC = "$env:APPDATA\gcloud\application_default_credentials.json"` (PowerShell).
  grafana-gcp:
    image: grafana/grafana:11.3.1
    profiles: ["gcp"]
    environment:
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Admin
      GF_INSTALL_PLUGINS: googlecloud-logging-datasource,googlecloud-trace-datasource
      GF_USERS_DEFAULT_THEME: light
      GOOGLE_APPLICATION_CREDENTIALS: /etc/gcp/adc.json
      GCP_PROYECTO: ${GCP_PROYECTO:-solventa-511815}
    volumes:
      - ${GCLOUD_ADC:-~/.config/gcloud/application_default_credentials.json}:/etc/gcp/adc.json:ro
      - ./observabilidad/gcp/provisioning:/etc/grafana/provisioning:ro
      - ./observabilidad/gcp/dashboards:/var/lib/grafana/dashboards:ro
    ports: ["127.0.0.1:3200:3000"]  # solo tu máquina: lleva tus credenciales de GCP
